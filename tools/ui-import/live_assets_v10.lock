# Krunker v10 (live client v10.0.2, 2026-10-13) content from the live asset hosts (tools/ui-import/fetch_live_assets.py).
# root assets = new in v10 (not in v7.1.4); assets-v10 = v10 version of a v7.1.4 file with other content (assets/v10/<path>);
# assets-aac = an MP4/AAC file the host serves under an .mp3 name, installed transcoded to MP3 at assets/<path>.
# root ui = page images v10 loads from assets.krunker.io/img/ (ui/img/<path>: the guide popup's img/guide/*, client/src/ui/v10_news.c).
# Installed by `make assets-import-live`; the store items of assets/skins.json index 6448+ are covered here (see v10_store_assets.js).
# Krunker Strike brand (doc/v10/krunker-strike.md, flavor-ui): from the live Krunker Strike FRVR site (krunkerstrike.frvr.com,
# frvr.com/play/krunkerstrike/) -- the logo (ui/img/kn-strike-logo.png, 1024x348) and the ChakraPetch 700 face it uses
# (ui/css/fonts/ChakraPetch-Bold.ttf, the same bytes Krunker v10 serves). Its stylesheet is a provenance note only (the
# palette / curtain colours in ui/css/krunknative.css come from it): assets/index-ANyEo1zZ.css
# https://krunkerstrike.frvr.com/assets/index-ANyEo1zZ.css sha256 874fc89ce2a3a4b9998429b77e304398da6416885c1a721022ed2a58a4172a8d size 591463.
# root	path	url	sha256	size
# img/backgrounds/gamecats/c_N.png: the Custom Games window's Popular Categories tiles (config.mapCatsP i, v10:216390) and the Host
# window's Community Games card (one of c_0/2/4/6/10/13, v10:215179); the imported page only had c_1.png
