# img/lottery_bg*.webp: the raffle window's theme backgrounds (svelte-1rj22es .lottery-window.theme-christmas / easter /
# neutral ::before, v10:125584; css/svelte.css). The bundle injects that CSS into the page, so they load from the page's own
