<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #1b1b2a; color: #fff; font-family: sans-serif; }
.icon { display: inline-block; width: 64px; height: 64px; background-color: #ffd54f; }
.lock { -webkit-mask: url(img/battlepass/lock.png) no-repeat center / contain; mask: url(img/battlepass/lock.png) no-repeat center / contain; }
.fade { -webkit-mask-image: linear-gradient(to right, #000 20%, transparent 100%); mask-image: linear-gradient(to right, #000 20%, transparent 100%); width: 300px; height: 64px; background: #3f8cff; }
.grad { background: linear-gradient(90deg, #ff6a0b, #fbc02d); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 96px; font-weight: bold; }
.row { position: absolute; left: 60px; display: flex; gap: 30px; align-items: center; }
</style></head><body>
<div class="row" style="top: 60px"><span class="icon lock"></span><span class="icon lock" style="background-color:#7ee787; width:96px; height:96px"></span><span class="fade"></span></div>
<div class="row" style="top: 220px"><span class="grad">KRUNKER</span></div>
<div class="row" style="top: 380px"><span class="icon" style="background: color-mix(in srgb, currentColor 30%, transparent); color:#ff00aa; width:200px; height:64px"></span><span style="background: color-mix(in srgb, red, blue); width:200px; height:64px; display:inline-block"></span></div>
<div class="row" style="top: 520px"><span style="display:inline-block;width:120px;height:50px;background:#555;outline:2px solid #4a9c0f;outline-offset:6px;border-radius:8px"></span><span style="display:inline-block;width:120px;height:50px;background:#555;outline:3px dashed #fff;outline-offset:-6px"></span></div>
</body></html>
