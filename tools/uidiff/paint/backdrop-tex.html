<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* .death-ui-bottom's backdrop over a textured background: the 30% black panel is blurred
 * (backdrop-filter: blur(10px)) and clipped to its rounded border box (radius 24px here). */
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
.art { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: url(img/battlepass/bg_window_5.png) 0 0 / 1280px 720px no-repeat; }
.panel { position: absolute; left: 40px; right: 40px; top: 380px; height: 300px; background: rgb(0 0 0 / 30%); backdrop-filter: blur(10px); border-radius: 24px; }
</style></head><body><div class="art"></div><div class="panel"></div></body></html>
