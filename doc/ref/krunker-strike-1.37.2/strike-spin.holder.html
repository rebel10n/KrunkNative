<div class="loading-screen" id="frvrLoadingScreen" style="display: none;">
  <div class="loading-screen__curtains">
    <div class="loading-screen__left-curtain">
    </div>
    <div class="loading-screen__right-curtain">
    </div>
  </div>
  <div class="loading-screen__center">
    <div class="loading-screen__loading-info">
      <span>
        Loading Assets
      </span>
    </div>
    <div class="loading-screen__cog">
      <img src="./img/cogwheel.svg">
    </div>
    <div class="loading-screen__logo">
      <img class="loading-screen__logo__img" src="./img/krunker_logo.png">
    </div>
    <div class="loading-screen__sparkles">
      <img src="./img/loading-sparkles.svg">
    </div>
  </div>
  <div class="loading-screen__loading-bar-bg">
  </div>
  <div class="loading-screen__loading-bar loading-screen__loading-bar--first-load">
  </div>
</div>

<div id="frvrMenuMobileHolder" style="--page-width: 640; --page-height: 360;">
  <div id="frvrMenuMobile">
    <div id="mobMenuBackground" style="background-image: url(&quot;./img/menu_bg_6.jpeg&quot;);">
      <div id="mobMenuBackgroundBlur">
      </div>
    </div>
    <div class="frvr-dark-blur">
    </div>
    <div class="frvr-spin-screen">
      <div class="frvr-top-controls-abs">
        <div class="frvr-controls-left">
          <div iconleft="./img/btn-arrow-left.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-back frvr-icon-back material-icons frvr-button--blue frvr-button--icon-only">
            <img src="./img/btn-arrow-left.svg" class="frvr-button__return-btns" style="image-rendering: unset;">
          </div>
          <div class="frvr-window-title ">
            Prize Wheels
          </div>
        </div>
        <div class="frvr-controls-right">
          <div class="currency-header">
            <div class="spin-tickets  spin-tickets--header">
              <img>
              <span>
                1
              </span>
              <div class="purchase-more-btn">
                <img>
              </div>
            </div>
            <div class="krunkies ">
              <img>
              <span>
                1250
              </span>
              <div class="purchase-more-btn">
                <img>
              </div>
            </div>
          </div>
          <div iconleft="./img/btn-home.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-home frvr-icon-home material-icons frvr-button--red  frvr-button--icon-only">
            <img src="./img/btn-home.svg" class="frvr-button__return-btns" style="image-rendering: unset;">
          </div>
        </div>
      </div>
      <div class="frvr-spin-left-container">
        <div class="featured-items-container">
          <div class="spinner-title">
            Ticket Spin
          </div>
          <div class="odds" style="">
            <div class="odd">
              <div class="odd-icon" style="background: rgb(167, 177, 194);">
              </div>
              <div class="odd-name">
                Common
              </div>
              <div class="odd-chance">
                50%
              </div>
            </div>
            <div class="odd">
              <div class="odd-icon" style="background: rgb(121, 217, 74);">
              </div>
              <div class="odd-name">
                Uncommon
              </div>
              <div class="odd-chance">
                28%
              </div>
            </div>
            <div class="odd">
              <div class="odd-icon" style="background: rgb(58, 160, 255);">
              </div>
              <div class="odd-name">
                Rare
              </div>
              <div class="odd-chance">
                14%
              </div>
            </div>
            <div class="odd">
              <div class="odd-icon" style="background: rgb(180, 92, 255);">
              </div>
              <div class="odd-name">
                Epic
              </div>
              <div class="odd-chance">
                6%
              </div>
            </div>
            <div class="odd">
              <div class="odd-icon" style="background: rgb(255, 184, 0);">
              </div>
              <div class="odd-name">
                Legendary
              </div>
              <div class="odd-chance">
                2%
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="frvr-spin-center-container">
        <div class="spin-wheel__container" style="--base-scale: 1px;">
          <canvas id="" class="" width="270" height="270" style="width: 270px; height: 270px;">
          </canvas>
          <div class="spin-wheel__button" style="">
            <div class="spin-wheel__cost-container">
              <div id="spinTopSection" class="spin-wheel__button spin-wheel__button--split-top" style="filter: brightness(1.15);">
                <div class="spin-wheel__cost-container">
                  <div class="spin-tickets  spin-tickets--outline">
                    <img>
                    <span>
                      10
                    </span>
                  </div>
                </div>
              </div>
              <div id="spinBottomSection" class="spin-wheel__button spin-wheel__button--split-bottom" style="filter: brightness(1.15);">
                <div id="oneTicketSpin" class="spin-wheel__cost-container">
                  <div class="spin-tickets  spin-tickets--outline">
                    <img>
                    <span>
                      1
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="frvr-spin-right-container">
        <div class="featured-items-container">
          <div class="featured-items-title">
            <span class="popupable">
              <img src="./img/frvr-ui/info-icon.svg">
            </span>
            <span>
              Featured items
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="frvr-notifications-holder">
  </div>
  <div class="ftue-overlay">
  </div>
  <div class="frvr-loading-holder">
  </div>
</div>
