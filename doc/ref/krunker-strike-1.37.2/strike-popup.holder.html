<div class="loading-screen" id="frvrLoadingScreen" style="display: none;">
  <div class="loading-screen__curtains">
    <div class="loading-screen__left-curtain">
    </div>
    <div class="loading-screen__right-curtain">
    </div>
  </div>
  <div class="loading-screen__center">
    <div class="loading-screen__loading-info">
      <span>
        Loading Assets
      </span>
    </div>
    <div class="loading-screen__cog">
      <img src="./img/cogwheel.svg">
    </div>
    <div class="loading-screen__logo">
      <img class="loading-screen__logo__img" src="./img/krunker_logo.png">
    </div>
    <div class="loading-screen__sparkles">
      <img src="./img/loading-sparkles.svg">
    </div>
  </div>
  <div class="loading-screen__loading-bar-bg">
  </div>
  <div class="loading-screen__loading-bar loading-screen__loading-bar--first-load">
  </div>
</div>

<div id="frvrMenuMobileHolder" style="--page-width: 640; --page-height: 360;">
  <div id="frvrMenuMobile" class="popup">
    <div class="frvr-dark-blur-75">
    </div>
    <div class="popup__holder ">
    </div>
  </div>
  <div class="frvr-notifications-holder">
  </div>
  <div class="ftue-overlay">
  </div>
  <div class="frvr-loading-holder">
  </div>
</div>
