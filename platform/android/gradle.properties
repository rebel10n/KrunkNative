org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# KrunkNative app configuration (override with -P<name>=<value> or ~/.gradle/gradle.properties):
#   krunknative.app             boxoffice (Krunker Box Office, io.krunknative.app) | strike (Krunker Strike,
#                               io.krunknative.strike: its own name, icon and page; installs next to Box Office)
#   krunknative.webDir          the assembled web client (make web -> dist/web), relative to this directory
#   krunknative.serverUrl       non-empty: the app opens this URL instead of the bundled client
#                               (like Krunker's apps wrapping krunker.io), e.g. https://play.example.com/
#   krunknative.wsUrl           bundled client: game server WebSocket (?ws=), e.g. ws://192.168.1.10:8080/native;
#                               empty = the embedded offline server (?offline=1)
#   krunknative.assetBaseUrl    bundled client: where /assets/* comes from when the APK does not carry it,
#                               e.g. http://192.168.1.10:8080/ (a `make bridge` host); empty = APK only
#   krunknative.bundleAssets    none | tracked | all: which of <repo>/assets goes into the APK
#                               (tracked = maps, img, shaders, skins.json; all = the ~1.5 GB mod.zip content)
krunknative.app=boxoffice
krunknative.webDir=../../dist/web
krunknative.serverUrl=
krunknative.wsUrl=
krunknative.assetBaseUrl=
krunknative.bundleAssets=tracked
