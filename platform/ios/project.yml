# XcodeGen spec for the Krunker Box Office iOS app (https://github.com/yonaskolb/XcodeGen);
# the project, target and bundle keep the old name KrunkNative (CI and build paths use it).
# Target KrunkStrike is the Krunker Strike app: the same code with its own bundle id
# (io.krunknative.strike), name, icon (AppIconStrike) and page (KNStartPage strike/index.html,
# platform/web/pwa.py), so both install side by side (scheme KrunkStrike, KN_SERVER_URL=https://krunk.io/strike/):
#   ./prepare.sh [dist/web dir]   # bundle the web client into web/
#   xcodegen generate             # -> KrunkNative.xcodeproj
#   xcodebuild -project KrunkNative.xcodeproj -scheme KrunkNative -sdk iphonesimulator \
#              -configuration Debug CODE_SIGNING_ALLOWED=NO build
# See platform/README.md.
name: KrunkNative
options:
  bundleIdPrefix: io.krunknative
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "10.0.4" # CI passes Krunker's version (client.yml: MARKETING_VERSION=$KN_KRUNKER_VERSION)
    CURRENT_PROJECT_VERSION: "1"
targets:
  KrunkNative:
    type: application
    platform: iOS
    sources:
      - path: KrunkNative
        # info.path below generates this Info.plist; copying it as a resource as well makes two
        # commands produce the bundle's Info.plist
        excludes:
          - Info.plist
      # The web client (make web -> dist/web, copied by prepare.sh) as a folder
      # reference: it lands in the app bundle as web/ with its tree intact.
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: KrunkNative/Info.plist
      properties:
        CFBundleDisplayName: Krunker Box Office
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Controllers drive the page through WKWebView's Gamepad API.
        GCSupportsControllerUserInteraction: true
        # LAN game servers / `make bridge` hosts are plain http/ws.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Krunker Box Office connects to game servers on your local network.
        # KrunkNative configuration (empty = bundled client with the offline server):
        # open this URL instead of the bundled client (like Krunker's apps): the build setting
        # KN_SERVER_URL (xcodebuild ... KN_SERVER_URL=https://krunk.io/, client.yml's .ipa)
        KNServerURL: "$(KN_SERVER_URL)"
        KNWebSocketURL: ""     # bundled client: game server WebSocket (?ws=)
        KNAssetBaseURL: ""     # bundled client: where /assets/* comes from when not bundled
        KNStartPage: index.html # bundled client: the page that opens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.krunknative.app
        KN_SERVER_URL: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
  # Krunker Strike: the KrunkNative target with the Strike identity (keep the two in step)
  KrunkStrike:
    type: application
    platform: iOS
    sources:
      - path: KrunkNative
        # the KrunkNative target's Info.plist (info.path there) is not this app's: never a resource here
        excludes:
          - Info.plist
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: KrunkStrike/Info.plist
      properties:
        CFBundleDisplayName: Krunker Strike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GCSupportsControllerUserInteraction: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Krunker Strike connects to game servers on your local network.
        KNServerURL: "$(KN_SERVER_URL)"
        KNWebSocketURL: ""
        KNAssetBaseURL: ""
        KNStartPage: strike/index.html # the Strike page starts the client as Krunker Strike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.krunknative.strike
        KN_SERVER_URL: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconStrike
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
