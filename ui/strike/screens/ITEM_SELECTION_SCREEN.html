<!-- FRVR Krunker Strike 1.37.2 ITEM_SELECTION_SCREEN (T5: Ks, the blue blur, the character viewer, Ps {onClose, onBack: true, title}, JI {itemSelection: true}, the items grid of rde squares), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). The parts below the frame are rde's square (an item: Kt thumbnail, wc item power label (Oo), the rarity banner; a skin colour: .item-selection__skin-color); client/src/ui/strike_menu.c fills them. -->
<div id="frvrMenuMobile" class=""><div id="mobMenuBackground" style="background-image: url(&quot;./img/menu_bg_6.jpeg&quot;);"></div><div class="item-selection__blue-blur"></div><div class="item-selection__character-holder"><canvas style="touch-action: none;"></canvas></div><div class="item-selection__top-controls"><div class="frvr-top-controls"><div class="frvr-controls-left"><div iconleft="./img/btn-arrow-left.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-back frvr-icon-back material-icons frvr-button--blue frvr-button--icon-only" onclick="strikeAction('back')"><img src="./img/btn-arrow-left.svg" class="frvr-button__return-btns" style="image-rendering: unset;"></div><div class="frvr-window-title ">{{title}}</div></div><div class="frvr-controls-right"><div iconleft="./img/btn-home.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-home frvr-icon-home material-icons frvr-button--red  frvr-button--icon-only" onclick="strikeAction('pop:2')"><img src="./img/btn-home.svg" class="frvr-button__return-btns" style="image-rendering: unset;"></div></div></div></div><div class="customization-screen__gradient-holder customization-screen__gradient-holder--item-selection"><div class="tap-to-play-gradient"><div class="tap-to-play-gradient-light"></div><div class="tap-to-play-gradient-light-source"></div></div></div><div class="item-selection__items-holder"><div class="item-selection__items-grid">{{!items}}</div></div></div>
<!-- part item -->
<div class="item-selection__item-square{{selected}}" onclick="strikeAction('item-pick:{{index}}')"><div class="item-selection__item-image"><img src="{{image}}" style="image-rendering: pixelated;"></div>{{!stat}}<div class="item-selection__item-label{{rarity}}"><span style="overflow: hidden; white-space: nowrap;" id="{{name}}-span">{{name}}</span></div></div>
<!-- part stat -->
<div class="item-label item-selection__item-stat"><span>+{{bonus}}%</span><img src="{{img}}"></div>
<!-- part skin -->
<div class="item-selection__item-square{{selected}}" onclick="strikeAction('item-pick:{{index}}')"><div class="item-selection__item-image"><div class="item-selection__skin-color" style="background: #{{color}};"></div></div><div class="item-selection__item-label "><span style="overflow: hidden; white-space: nowrap;" id="{{name}}-span">{{name}}</span></div></div>
