<!-- FRVR Krunker Strike 1.37.2 PROGRESSION_TRACK (KU: the Rewards Track inside PROFILE's .frvr-account-progression, one Gue column per level), single-track form (no premium track: isPremiumTrackAvailable() is false without accountProgressionPremium), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). client/src/ui/strike_meta.c fills it from the game config's accountProgression. -->
<div class="frvr-progression-track-rewards"><div class="frvr-progression-track-rewards__treadmill-container"><div class="frvr-progression-track-rewards__treadmill frvr-progression-track-rewards__treadmill--single"><div class="frvr-progression-track-rewards__treadmill-rows frvr-progression-track-rewards__treadmill-rows--single"><div class="frvr-progression-track-rewards__treadmill-button-holder frvr-progression-track-rewards__treadmill-button-holder--single" onclick="strikeAction('track-slide:-1')"><div class="frvr-progression-track-rewards__treadmill-button"><div class="frvr-progression-track-rewards__treadmill-arrow"></div></div></div><div class="frvr-progression-track-rewards__treadmill-columns">{{!columns}}</div><div class="frvr-progression-track-rewards__treadmill-button-holder frvr-progression-track-rewards__treadmill-button-holder--single" onclick="strikeAction('track-slide:1')"><div class="frvr-progression-track-rewards__treadmill-button"><div class="frvr-progression-track-rewards__treadmill-arrow frvr-progression-track-rewards__treadmill-arrow--right"></div></div></div></div></div><div class="frvr-progression-track-rewards__button-area"><div class="empty-button-slot"></div>{{!claim}}<div id="accountdetails" trackingid="profile_account_details" class="frvr-button frvr-button--size-md frvr-button--gray" onclick="strikeAction('profile-details')"><span class="frvr-button-text">Account Details</span></div></div></div></div>
<!-- part claim -->
<div id="claimrewards" class="frvr-button frvr-button--size-md" onclick="strikeAction('track-claim')"><span class="frvr-button-text">Claim Rewards</span></div>
<!-- part claim-disabled -->
<div id="claimrewards" disabled="" class="frvr-button frvr-button--size-md is-disabled"><span class="frvr-button-text">Claim Rewards</span></div>
<!-- part column -->
<div class="frvr-progression-track-rewards__column" style="--column-width: {{width}};"><div class="frvr-progression-track-rewards__col-number {{numberClass}}" style="--column-width: {{width}};"><span>{{level}}</span></div><div class="{{cardClass}}" style="--column-width: {{width}};">{{!slot}}<div class="frvr-progression-track-rewards__card-label-slot"><span>{{label}}</span></div></div></div>
<!-- part img-slot -->
<div class="frvr-progression-track-rewards__card-img-slot">{{!check}}{{!pick}}{{!images}}</div>
<!-- part check -->
<div class="frvr-progression-track-rewards__img-slot-icon-check"><img src="./img/frvr-ui/check.svg"></div>
<!-- part pick-one -->
<div class="frvr-progression-track-rewards__img-slot-pick-one">Pick one</div>
<!-- part image -->
<img class="" src="{{src}}" style="image-rendering: unset;">
