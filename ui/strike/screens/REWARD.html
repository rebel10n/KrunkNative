<!-- FRVR Krunker Strike 1.37.2 REWARD (VC, exported as Es: Ks {blur: true}, the dark blur, the rarity's lights and colour (computeLightsColor: non-item, uncommon-item .. legendary-item), .frvr-reward-screen with [Wre (its view returns nothing)] and the Ss builder: Ps for a spin ticket, buildReward, buildTitle, buildButtons), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). client/src/ui/strike_reward.c fills .frvr-reward-screen from the parts below, one reward after another (nextItemOrPop). -->
<div id="frvrMenuMobile"><div id="mobMenuBackground" style="background-image: url(&quot;./img/menu_bg_6.jpeg&quot;);"><div id="mobMenuBackgroundBlur"></div></div><div class="frvr-dark-blur"></div><div class="reward-screen-bg-lights"><img src="./img/reward-bg/reward-bg-lights-non-item.svg"></div><div class="reward-screen-bg"><img src="./img/reward-bg/reward-bg-color-non-item.svg"></div><div class="frvr-reward-screen"></div></div>
<!-- part controls -->
<div class="frvr-top-controls-abs"><div class="frvr-controls-left"><div iconleft="./img/btn-arrow-left.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-back frvr-icon-back material-icons frvr-button--blue frvr-button--icon-only" onclick="strikeAction('reward-back')"><img src="./img/btn-arrow-left.svg" class="frvr-button__return-btns" style="image-rendering: unset;"></div></div><div class="frvr-controls-right"><div iconleft="./img/btn-home.svg" iconleftclass="frvr-button__return-btns" class="frvr-button frvr-button-home frvr-icon-home material-icons frvr-button--red  frvr-button--icon-only" onclick="strikeAction('reward-next')"><img src="./img/btn-home.svg" class="frvr-button__return-btns" style="image-rendering: unset;"></div></div></div>
<!-- part stars -->
<div class="reward-screen-bg__star-container"><canvas class=""></canvas></div>
<!-- part viewer -->
<div class="reward-viewer-image"><img src="{{image}}" style="image-rendering: {{rendering}};"></div>
<!-- part class -->
<div class="reward-class"><div class="reward-screen-bg__star-container"><canvas class=""></canvas></div><div class="canvas-placeholder"></div></div>
<!-- part image -->
<img src="{{image}}" class="{{class}}">
<!-- part title -->
<div class="screen-title"><div class="reward-title">{{title}}</div><div class="reward-subtitle">{{subtitle}}</div></div>
<!-- part power -->
<div class="item-label-large frvr-reward-screen__item-power"><span>+{{bonus}}%</span><img src="{{img}}" class="stats">{{!arrow}}</div>
<!-- part banner -->
<div><div class="golden-spin-found" onclick="strikeAction('reward-next')"><div class="golden-spin-found__stars"><img src="./img/golden-banner-stars.svg"></div><div class="golden-spin-found__content"><img src="./img/golden-ticket.svg"><span>{{text}}</span></div><div class="golden-spin-found__shine"><div class="shine-holder" style="--max-width: 189;"><div class="shine"><div class="shine__big"></div><div class="shine__small"></div></div></div></div></div></div>
<!-- part buttons-item -->
<div class="buttons">{{!banner}}{{!power}}<div><div id="applyRewardNow" class="frvr-button frvr-button--size-md frvr-button--width-150{{disabled}}" onclick="strikeAction('reward-equip')"><span class="frvr-button-text">{{equip}}</span></div></div><div><div class="frvr-button frvr-button--blue frvr-button--size-sm frvr-button--width-100" onclick="strikeAction('reward-next')"><span class="frvr-button-text">Okay</span></div></div></div>
<!-- part buttons-class -->
<div class="buttons"><div></div><div><div id="applyRewardNow" class="frvr-button frvr-button--size-md frvr-button--width-150" onclick="strikeAction('reward-select-class')"><span class="frvr-button-text">Select now!</span></div></div><div><div class="frvr-button frvr-button--blue frvr-button--size-sm frvr-button--width-100" onclick="strikeAction('reward-next')"><span class="frvr-button-text">Okay</span></div></div></div>
<!-- part buttons-one -->
<div class="buttons"><div></div><div><div class="frvr-button frvr-button--size-md frvr-button--width-150" onclick="strikeAction('{{action}}')"><span class="frvr-button-text">{{label}}</span></div></div><div></div></div>
