<!-- FRVR Krunker Strike 1.37.2 product popup (U2, the builder sU's market item gives the POPUP frame In: --color the rarity's (Iy), the lightbox background, the header (Cv name, Mv rarity + type, the weapon's class), the default shop design's struck full price (nU: ceil(price / (1 - 0.25))) and -25% label, the item power label (Vle), the close button (co: kt), the 2D reward viewer (r1 {distance: 20}), the purchase button (YA: the KR price, onPurchase kt() then $r)), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). client/src/ui/strike_reward.c builds it into .popup__holder. -->
<div class="store-confirm-purchase" style="--color: {{color}};"><div class="store-confirm-purchase-background"></div><div class="store-confirm-purchase__header"><div class="store-confirm-purchase__header-name">{{name}}</div><div class="store-confirm-purchase__header-description">{{description}}</div></div><div class="store-confirm-purchase__price-label-full">{{full}}</div>{{!power}}<div class="store-confirm-purchase__item-discount-label">-25%</div><div class="frvr-button store-confirm-purchase__close frvr-icon-close material-icons frvr-button--red" onclick="strikeAction('back')"><span class="frvr-button-text">close</span></div><div class="reward-viewer-image"><img src="{{image}}" style="image-rendering: pixelated;"></div><div iconleft="./img/frvr-ui/menu-kr-icon-border.svg" class="frvr-button frvr-button--size-md frvr-button--width-100 store-confirm-purchase__button frvr-button--secondary" onclick="strikeAction('{{buy}}')"><img src="./img/frvr-ui/menu-kr-icon-border.svg" style="image-rendering: unset;"><span class="frvr-button-text">{{price}}</span></div></div>
<!-- part power -->
<div class="item-label-large store-confirm-purchase__item-power-label"><span>+{{bonus}}%</span><img src="{{img}}" class="stats">{{!arrow}}</div>
