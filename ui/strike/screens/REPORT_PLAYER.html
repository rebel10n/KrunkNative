<!-- FRVR Krunker Strike 1.37.2 REPORT_PLAYER (Hy in the a1 prompt frame: Z7 reason dropdown (jl) over xe.reportOptions, RD comments textarea, Cancel / Report player; opts translucent), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). client/src/ui/strike_social.c drives it and sends the report to kn_brain ("rpt"). -->
<div id="frvrMenuMobile"><div class="frvr-dark-blur"></div><div class="mobPopPrompt  report-player"><div class="frvr-top-controls-abs"><div class="frvr-controls-left"></div><div class="frvr-controls-right"></div></div><div class="frvr-scroll-wrapper"><div class="frvr-scroll-content"><div class="prompt-content"><div class="header"><span>Reporting </span><span class="player-name"><strong>{{name}}</strong></span></div><div class="innercontent"><div class="frvr-input-group"><label for="reason">What is the main reason for this report?</label>{{!dropdown}}</div><div class="frvr-input-group"><label for="reasonComments">Additional comments</label><textarea id="reasonComments" placeholder="Type here" cols="2" class="" oninput="strikeAction('report-input')"></textarea></div></div><div class="buttons"><div class="frvr-button frvr-button--gray" onclick="strikeAction('back')"><span class="frvr-button-text">Cancel</span></div><div class="frvr-button frvr-button--red" onclick="strikeAction('report-send')"><span class="frvr-button-text">Report player</span></div></div></div></div></div></div></div>
<!-- part dropdown -->
<div tabindex="0" class="dropdown-container {{class}}" id="reason"><div class="dropdown-header" onclick="strikeAction('report-reason-toggle')"><span>{{label}}</span><div class="material-icons">{{icon}}</div></div>{{!options}}</div>
<!-- part options -->
<div class="dropdown-options-wrapper" onclick="strikeAction('report-reason-toggle')"><div class="dropdown-options">{{!list}}</div></div>
<!-- part option -->
<div class="dropdown-option {{class}}" onclick="strikeAction('report-reason:{{index}}')">{{label}}</div>
<!-- part error -->
<div class="input-error">{{message}}</div>
