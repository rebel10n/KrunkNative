<div id="frvrMenuMobile">
<div id="mobMenuBackground" style="background-image: url(&quot;./img/menu_bg_6.jpeg&quot;);">
<div id="mobMenuBackgroundBlur">
</div>
</div>
<div class="frvr-dark-blur">
</div>
<div class="frvr-screen">
<div class="feedback-form">
<div class="feedback-form__holder">
<div class="feedback-form__title"><span>Help us improve</span></div>

<div class="frvr-input-group">
<label for="feedbackTextForm"></label>
<textarea id="feedbackTextForm" placeholder="Tell us what you think." cols="2" oninput="strikeFeedback('text')"></textarea>
</div>
<div class="feedback-form__email-title"><span>Want to hear back from us?</span></div>
<div class="frvr-input-group">
<label for="optionalEmail"></label>
<input id="optionalEmail" type="email" placeholder="Type your e-mail here (optional)" autocomplete="email" oninput="strikeFeedback('email')">
</div>
</div>
<div class="feedback-form__buttons">
<div trackingid="feedback_cancel" class="frvr-button frvr-button--gray frvr-button--width-120 frvr-button--size-md" onclick="strikeAction('back')"><span class="frvr-button-text">Cancel</span></div>
<div trackingid="feedback_submit" class="frvr-button frvr-button--width-120 frvr-button--size-md" onclick="strikeAction('feedback-submit')"><span class="frvr-button-text">Submit</span></div>
</div>
</div>
</div>
</div>
