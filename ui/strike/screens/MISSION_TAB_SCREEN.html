<!-- FRVR Krunker Strike 1.37.2 MISSION_TAB_SCREEN (UD: uX header + one hX card per daily mission), the Battle Pass screen's Missions tab content (.tabsContent), TRANSCRIBED from the Mithril views of assets/index-Cz2uYXJQ.js (no sandbox capture exists: not pixel-verified). The 1.37.2 stylesheet has no .frvr-mission-card rules: FRVR shows these cards unstyled. client/src/ui/strike_meta.c fills them. -->
<div class="frvr-bp-missions-tab__header"><div class="frvr-bp-missions-tab__title"><span>Daily missions</span></div></div><div class="frvr-bp-missions-tab__missions-list">{{!missions}}</div>
<!-- part card -->
<div class="frvr-mission-card"><div class="frvr-mission-card__decoration"><div class="frvr-mission-card__decoration-item"></div><div class="frvr-mission-card__decoration-item"></div><div class="frvr-mission-card__decoration-item"></div></div><div class="frvr-mission-card__image"><img src="{{icon}}" style="image-rendering: pixelated;"></div><div class="frvr-mission-card__content"><div class="frvr-mission-card__mission-title"><span>{{title}}</span>{{!timeleft}}</div><div class="frvr-mission-card__mission-rewards">{{!rewards}}</div><div class="frvr-mission-card__mission-progress" style="--mission-progress: {{progress}};"><div class="frvr-mission-card__mission-progress-inner"></div><div class="frvr-mission-card__mission-progress-text">{{progressText}}</div></div></div></div>
<!-- part timeleft -->
<div class="frvr-mission-card__mission-timeleft">{{time}}</div>
<!-- part bpp -->
<div class="frvr-mission-card__mission-reward-stat"><span>{{value}}</span><span style="color: #fbc02d">BPP</span></div>
<!-- part kr -->
<div class="frvr-mission-card__mission-reward-stat"><span>+{{value}}</span><span style="color: #fbc02d">KR</span></div>
<!-- part junk -->
<div class="frvr-mission-card__mission-reward-stat"><span>+{{value}}</span><div class="material-icons junk-icon">plumbing</div></div>
<!-- part loading -->
<div class="frvr-bp-loading"><span>Loading {{screen}}</span></div>
<!-- KrunkNative: a failed load says so, with a Retry (strike_meta.c bp_tab) -->
<!-- part failed -->
<div class="frvr-bp-loading"><span>{{message}}</span></div><div class="frvr-button frvr-button--blue frvr-button--width-150" onclick="strikeAction('{{action}}')"><span class="frvr-button-text">{{retry}}</span></div>
