<div class="settingsHeader">
            <div style="display:inline-block;text-align:right;float:right;">
                <div class="settingsBtn" onclick="resetSettings()">Reset</div>
                <div class="settingsBtn" onclick="exportSettings()">Export</div>
                <div class="settingsBtn" onclick="importSettings()">Import</div>
                <select id="settingsPreset" onchange="selectSettingPre(this.value)" class="inputGrey2" style="margin-left:0px;font-size:14px">
                    <option value="0">Default</option>
                    <option value="1">Pro</option>
                    <option value="3">Performance</option>
                    <option value="2" selected="">Custom</option>
                </select>
            </div>
            <div style="display:inline-block;width:220px;">
                <input id="settSearch" type="text" placeholder="Search" oninput="windows[0].searchList()">
            </div>
            <div id="settingsTabLayout"><div class="settingTab " onclick="window.windows[0].changeTab(0)">General</div>
<div class="settingTab " onclick="window.windows[0].changeTab(1)">Controls</div>
<div class="settingTab " onclick="window.windows[0].changeTab(2)">Display</div>
<div class="settingTab " onclick="window.windows[0].changeTab(3)">Render</div>
<div class="settingTab " onclick="window.windows[0].changeTab(4)">Game</div>
<div class="settingTab " onclick="window.windows[0].changeTab(5)">Sound</div></div>
        </div>
