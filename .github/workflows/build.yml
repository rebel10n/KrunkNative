name: Build

# CI builds and checks only: the client packages (`client-latest`, `client-v*`) are client.yml's,
# the dedicated servers release.yml's.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One running + one pending run per branch (superseded pushes are skipped, a running build is
# not cancelled: agents push faster than a build takes); PR runs cancel their predecessor.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Emscripten release used by the `web` job (matches the local toolchain).
  EM_VERSION: 6.0.12
  EM_CACHE_FOLDER: emsdk-cache

jobs:
  # Build version for kn_version.h (tools/release/version-meta.sh): git describe needs the
  # history and tags, the build jobs check out shallow and get it as -DKRUNKNATIVE_VERSION_*.
  meta:
    name: Version
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' # CI runs on main only
    runs-on: ubuntu-latest
    outputs:
      cmake_flags: ${{ steps.meta.outputs.cmake_flags }}
      describe: ${{ steps.meta.outputs.describe }}
      commit: ${{ steps.meta.outputs.commit }}
      commit12: ${{ steps.meta.outputs.commit12 }}
      commit_time: ${{ steps.meta.outputs.commit_time }}
      build_time: ${{ steps.meta.outputs.build_time }}
      protocol: ${{ steps.meta.outputs.protocol }}
      kn_build: ${{ steps.meta.outputs.kn_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version metadata
        id: meta
        run: tools/release/version-meta.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux (GCC)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # libegl-dev: the headless EGL mode (client/include/headless.h) is compiled in.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxcb-present-dev \
            libegl-dev

      # The in-house HTML/CSS engine is part of the default build (HTML_ENGINE=ON).
      - name: Build (Release)
        run: make release CMAKE_FLAGS="${{ needs.meta.outputs.cmake_flags }}"

      # CI has only the tracked files: the game content under assets/*/* is gitignored
      # (only maps/, img/ and shaders/ are tracked), so nothing here may start client_bin
      # (fonts, models, textures). `make smoke-native` and `make uidiff` are local checks.
      - name: Run tests
        run: ./cmake-build-release/proc_input_test

      # ui_test is built with the engine; the Lexbor smoke probe needs no display or assets.
      - name: HTML engine smoke probe
        run: ./cmake-build-release/ui_test lexbor-probe

      - name: Stage Linux artifact
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp -v cmake-build-release/client_bin cmake-build-release/server_bin dist/
          cp -r ui dist/ui
          # no `| head` under pipefail: ls/find die of SIGPIPE once head has its lines
          du -sh dist
          find dist -maxdepth 1 | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-linux-x86_64
          path: dist/**
          if-no-files-found: error

  windows:
    name: Windows (MinGW-w64)
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      # The HTML engine is pure C (Lexbor + FreeType), so MinGW builds it too.
      - name: Build (Release)
        run: make release CMAKE_FLAGS="${{ needs.meta.outputs.cmake_flags }}"

      - name: Run tests
        run: ./cmake-build-release/proc_input_test.exe

      - name: HTML engine smoke probe
        run: ./cmake-build-release/ui_test.exe lexbor-probe

      - name: Stage Windows artifact (exes + runtime DLLs)
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp -v cmake-build-release/client.exe dist/
          cp -v cmake-build-release/server.exe dist/

          echo "=== ldd dist/client.exe ==="
          ldd dist/client.exe || true
          echo "=== ldd dist/server.exe ==="
          ldd dist/server.exe || true

          # Recursively resolve MinGW DLL dependencies of the exes and copy
          # everything that lives under the MSYS2 prefix (mingw64/ucrt64) into
          # the artifact dir. Without this, end-users hit "libbrotlidec.dll /
          # libbz2-1.dll not found" errors because FreeType pulls in brotli,
          # bzip2, harfbuzz, png, zlib, etc. at runtime.
          #
          # `ldd` on MSYS2 emits Windows-style absolute paths like
          # `D:/a/_temp/msys64/mingw64/bin/libfoo.dll`, so we match on the
          # `/mingw64/bin/` or `/ucrt64/bin/` substring rather than a leading
          # slash. System DLLs under C:/WINDOWS are skipped automatically.
          resolve_deps() {
            target="$1"
            seen_file="$2"
            depth="${3:-0}"
            indent=$(printf '%*s' "$((depth * 2))" '')
            echo "${indent}-> resolving deps of $target"
            deps=$(ldd "$target" 2>/dev/null \
              | awk '{print $3}' \
              | grep -Ei '/(mingw64|ucrt64)/bin/' || true)
            if [ -z "$deps" ]; then
              echo "${indent}   (no MinGW deps)"
              return 0
            fi
            echo "$deps" | while read -r dll; do
              [ -z "$dll" ] && continue
              name="$(basename "$dll")"
              if grep -qx "$name" "$seen_file" 2>/dev/null; then
                echo "${indent}   skip  $name (already bundled)"
              else
                echo "$name" >> "$seen_file"
                echo "${indent}   copy  $name  <-  $dll"
                cp -n "$dll" dist/
                resolve_deps "$dll" "$seen_file" "$((depth + 1))"
              fi
            done
          }

          : > dist/.seen
          resolve_deps dist/client.exe dist/.seen
          resolve_deps dist/server.exe dist/.seen
          rm -f dist/.seen

          cp -r ui dist/ui

          echo "=== Final artifact contents ==="
          ls -la dist/
          echo "=== Bundled DLL count ==="
          ls -1 dist/*.dll 2>/dev/null | wc -l || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-windows-x86_64-mingw
          path: dist/**
          if-no-files-found: error

  # Native macOS renders through Metal via ANGLE (OpenGL ES 3.0, the KN_GLES path the web
  # build shares; README.md "ANGLE / Metal (macOS)"). CI never builds ANGLE: the ANGLE jobs
  # download the prebuilt release asset pinned and checksummed in tools/angle/angle.lock
  # (tools/angle/fetch-angle.sh; published by the dispatch-only `angle` workflow) and are
  # skipped, with a warning, when there is none for their arch. The `desktop` entry keeps
  # Apple's deprecated OpenGL 4.1 fallback (KRUNKNATIVE_GL_BACKEND=desktop) compiling.
  macos:
    needs: meta
    name: macOS (Clang, ${{ matrix.gl == 'angle' && 'ANGLE/Metal' || 'desktop GL 4.1' }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            gl: angle
          # macos-13 (the last Intel "latest") was retired on 2025-12-04;
          # macos-15-intel is the supported x86_64 label until ~Aug 2027.
          - runner: macos-15-intel
            arch: x86_64
            gl: angle
          - runner: macos-latest
            arch: arm64
            gl: desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-dist
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # available=false when angle.lock has no asset for this arch: the job's build steps are
      # skipped (the desktop entry still compiles the macOS code).
      - name: Fetch prebuilt ANGLE
        if: matrix.gl == 'angle'
        id: angle
        run: tools/angle/fetch-angle.sh "macos-${{ matrix.arch }}" "$ANGLE_DIR" >> "$GITHUB_OUTPUT"

      # The runner images ship cmake, ninja and pkg-config: install only what is missing and
      # never `brew update`/upgrade. Homebrew has no Intel bottles any more, so an upgrade
      # there compiles cmake from source (~45 min).
      - name: Install build dependencies
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euo pipefail
          missing=()
          for tool in cmake ninja pkg-config; do command -v "$tool" > /dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then brew install "${missing[@]}"; fi
          cmake --version | sed -n 1p
          echo "ninja $(ninja --version), pkg-config $(pkg-config --version)"
          # services/ (knsvc, linked by server_bin) needs libcrypto: Homebrew's keg-only OpenSSL
          for formula in openssl@3 openssl@4; do
            prefix="$(brew --prefix "$formula" 2> /dev/null || true)"
            if [ -n "$prefix" ] && [ -d "$prefix/include/openssl" ]; then
              echo "OPENSSL_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
              echo "OpenSSL: $prefix"
              break
            fi
          done

      - name: Build (Release)
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        run: make release CMAKE_FLAGS="-DKRUNKNATIVE_GL_BACKEND=${{ matrix.gl }} ${{ needs.meta.outputs.cmake_flags }}"

      - name: Run tests
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        run: ./cmake-build-release/proc_input_test

      - name: HTML engine smoke probe
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        run: ./cmake-build-release/ui_test lexbor-probe

      # client_bin links @rpath/libEGL.dylib with an @executable_path rpath, and the build copied
      # ANGLE's dylibs next to it (GLFW dlopens @rpath/libEGL.dylib + @rpath/libGLESv2.dylib).
      - name: Check ANGLE bundling
        if: matrix.gl == 'angle' && steps.angle.outputs.available == 'true'
        run: |
          set -euxo pipefail
          otool -L cmake-build-release/client_bin | tee /dev/stderr | grep -q '@rpath/libEGL.dylib'
          otool -l cmake-build-release/client_bin | grep -A2 LC_RPATH | grep -q '@executable_path'
          for lib in libEGL.dylib libGLESv2.dylib; do
            test -f "cmake-build-release/$lib"
            otool -D "cmake-build-release/$lib" | grep -q "@rpath/$lib"
          done

      # No headless client_bin screenshots here: the client needs the gitignored game assets
      # (fonts, models, textures). Run them locally with the assets (README.md "ANGLE / Metal").

      - name: Stage macOS artifact
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp -v cmake-build-release/client_bin cmake-build-release/server_bin dist/
          # ANGLE (Metal): client_bin loads them from its own directory (@executable_path rpath)
          if [ "${{ matrix.gl }}" = angle ]; then cp -v cmake-build-release/libEGL.dylib cmake-build-release/libGLESv2.dylib dist/; fi
          cp -R ui dist/ui
          # no `| head` under pipefail: ls/find die of SIGPIPE once head has its lines
          du -sh dist
          find dist -maxdepth 1 | sort

      - name: Upload artifacts
        if: matrix.gl == 'desktop' || steps.angle.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-macos-${{ matrix.arch }}${{ matrix.gl == 'desktop' && '-desktop-gl' || '' }}
          path: dist/**
          if-no-files-found: error

  web:
    name: Web (Emscripten / WebGL2)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' # CI runs on main only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rsync

      # setup-emsdk caches the SDK itself in EM_CACHE_FOLDER; the extra
      # actions/cache step also keeps the system libraries Emscripten builds
      # on first use (libc, libGL, ...) between runs.
      - name: Cache emsdk
        uses: actions/cache@v6
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ env.EM_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: Verify toolchain
        run: emcc -v

      # The page is ui/ with only the web glue (js/kn-shim.js + js/loader.js); the C UI
      # logic drives its DOM through client/src/html/web_dom.c.
      - name: Build web client
        run: make web

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f dist/web/index.html
          test -f dist/web/client.js
          test -f dist/web/client.wasm
          test -f dist/web/client.data
          test -f dist/web/js/kn-shim.js
          test -f dist/web/js/loader.js
          ls -la dist/web

      # What deploy-kru.yml publishes on GitHub Pages (deploy/pages/README.md), staged once to
      # catch a broken page before main: kn-config.json, the meta knobs, the Pages limits.
      - name: Stage for GitHub Pages (check)
        env:
          KN_PAGES_LIVE_URL: ""
          KN_GH_PAGES_STAGE: ${{ runner.temp }}/gh-pages
        run: deploy/pages/github.sh && cat "$KN_GH_PAGES_STAGE/kn-config.json"

      # dist/web/assets is a symlink/copy of the (gitignored, ~1.5 GB) game
      # assets; it is never shipped in the artifact.
      - name: Stage web artifact (without assets/)
        run: |
          set -euxo pipefail
          mkdir -p stage
          rsync -a --exclude='/assets' --exclude='/assets/' dist/web/ stage/web/
          du -sh stage/web
          find stage/web -maxdepth 1 | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-web
          path: stage/web/**
          if-no-files-found: error

  # Krunker's mobile apps wrapped the web game; platform/android does the same with
  # the web client from the `web` job bundled into the APK (platform/README.md).
  android:
    name: Android (WebView app, debug APK)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: KrunkNative-web
          path: dist/web

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # v3 installs the long-removed `tools` package by default and fails in sdkmanager.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: platform/android
        run: ./gradlew --no-daemon assembleDebug

      # client.yml's published APK: the release build over https://krunk.io/ (signed there with the
      # repository key; unsigned here, it only has to build)
      - name: Build release APK (unsigned)
        working-directory: platform/android
        run: ./gradlew --no-daemon assembleRelease -Pkrunknative.serverUrl=https://krunk.io/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-android-debug
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # platform/ios (WKWebView, XcodeGen spec): unsigned simulator build.
  ios:
    name: iOS (WKWebView app, simulator build)
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: KrunkNative-web
          path: dist/web

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: platform/ios
        run: |
          ./prepare.sh ../../dist/web
          xcodegen generate

      - name: Build for the iOS simulator (unsigned)
        working-directory: platform/ios
        run: |
          set -o pipefail
          xcodebuild -project KrunkNative.xcodeproj -scheme KrunkNative -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-ios-simulator
          path: platform/ios/build/Build/Products/Debug-iphonesimulator/KrunkNative.app
          if-no-files-found: error

  # `make check`: the debug build, every test of `make test`, `make lint` (actionlint +
  # shellcheck on the workflows, CMakePresets.json, ui/js) and the net-bridge typecheck. Plus
  # shellcheck of the CI/deploy scripts.
  check:
    name: make check (tests, lint, net-bridge typecheck)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' # CI runs on main only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: net-bridge/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config shellcheck \
            libwayland-dev wayland-protocols libx11-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxcb-present-dev libegl-dev
          # pinned; `make lint` runs it (it skips without one) and it runs shellcheck on run: blocks
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: net-bridge dependencies
        working-directory: net-bridge
        run: npm ci

      - name: make check
        run: make check

      - name: shellcheck (CI and deploy scripts)
        run: shellcheck -S warning tools/release/*.sh tools/angle/*.sh deploy/ansible/build.sh
