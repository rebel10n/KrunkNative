name: Deploy edges

# After every successful Deploy kru on main (workflow_run), or by hand: builds server_bin for the
# edges' Debian releases (deploy/ansible/build.sh: trixie = every kn-<site> VM;
# bullseye and bookworm are built still, unused since the old VPSs left) and runs deploy/ansible/edges.yml (by default the edge infra:
# firewall, fail2ban (on the kn-<site> VMs, group edges_kn, this repo owns the base), user, release, gameserver; DNS needs a token with Zone DNS:Edit), the canary (ashburn) first: the rest only after
# its instance 1 answers the server-info query again. The game servers restart only when
# server_bin, its data or its config changed: server_bin is reproducible and stamped with the last
# commit that changed the service sources (tools/release/version-meta.sh --server), and the release
# dir is named by its content (role kn_release), so most pushes change nothing on the edges. A
# restart drains: every instance finishes its round (kn_gameserver_drain_timeout, 240 s, all
# instances of a host in parallel), its players get "GAME UPDATING" and rejoin with a fresh ticket.
# The edges also run abulxt: only the KrunkNative release + kn-gameserver@ units (Box Office) and
# kn-strike@ units (Krunker Strike, port 21115+, deploy/ansible/README.md "Krunker Strike servers")
# are touched (no DNS here).
#
# Secrets: EDGES_SSH_KEY (CI-only ed25519, comment krunknative-github-ci-edges, in each edge's
#          root authorized_keys with no-agent/X11/port-forwarding; the kn-<site> VMs too),
#          EDGES_KNOWN_HOSTS (the edges' host keys, by the HostName in deploy/ansible/ssh_config), and KRU_SSH_KEY KRU_HOST KRU_PORT KRU_KNOWN_HOSTS: kn_gameserver reads the
#          coordinator secrets (KN_BRAIN_INTERNAL_SECRET / JOIN_SECRET) from kru's
#          /etc/krunknative/secrets.env at deploy time (slurp, no_log) into the 0640 server-<n>.cfg.
#          DIVIDE_SSH_KEY, DIVIDE_KNOWN_HOSTS: kru (CT 120) and kn-mnz (CT 203, ashburn) are guests of
#          the Proxmox host divide, reached through it (inventory group divide, ProxyJump divide);
#          kn-mnz takes EDGES_SSH_KEY like the other edges, its host key in EDGES_KNOWN_HOSTS by
#          its HostName 172.16.5.94.
on:
  workflow_run:
    workflows: ["Deploy kru"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "edges.yml tags (firewall,fail2ban,user,release,gameserver[,rentd][,dns])"
        type: string
        default: firewall,fail2ban,user,release,gameserver
      hosts:
        description: "Edges: all (the live one: ashburn), or a comma list of those (the canary goes first)"
        type: string
        default: all
      dry_run:
        description: "ansible --check --diff only (builds, connects, changes nothing)"
        type: boolean
        default: false

concurrency:
  group: deploy-edges
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # deploys only from main: a dispatch on main, or Deploy kru finishing successfully on main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.plan.outputs.first }}
      canary: ${{ steps.plan.outputs.canary }}
      rest: ${{ steps.plan.outputs.rest }}
      edges: ${{ steps.plan.outputs.edges }}
      cmake_flags: ${{ steps.meta.outputs.cmake_flags }}
      commit12: ${{ steps.meta.outputs.commit12 }}
      describe: ${{ steps.meta.outputs.describe }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version metadata
        id: meta
        run: tools/release/version-meta.sh --server "$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

      # edge name -> inventory host (deploy/ansible/inventory/hosts.yml). live = what "all" (and every
      # Deploy kru run) deploys, canary = the edge that goes first. Since the cutover (2026-11-13) the
      # new VMs (edges_kn) are live; the old VPSs are gone. Since 2026-11-23 one is left: ashburn (kn-mnz,
      # CT 203 on divide, 9 servers), the canary. kn-mia, kn-iev and kn-jnb went on 2026-11-19 (no ping /
      # ssh, their servers moved to divide), kn-ams on 2026-11-23 (inventory/hosts.yml).
      - name: Hosts
        id: plan
        env:
          HOSTS: ${{ inputs.hosts || 'all' }}
        run: |
          set -euo pipefail
          declare -A inv=([ashburn]=kn-mnz)
          live="ashburn" canary=ashburn
          sel="$(tr -d ' ' <<< "$HOSTS" | tr '[:upper:]' '[:lower:]')"
          [ "$sel" = all ] && sel="$live"
          first="" first_edge="" rest="" edges=""
          IFS=, read -r -a names <<< "$sel"
          for n in "${names[@]}"; do
            [ -n "${inv[$n]:-}" ] || { echo "::error::unknown edge '$n' (${!inv[*]})"; exit 1; }
            [[ ",$edges," == *",$n,"* ]] && continue
            edges="${edges:+$edges,}$n"
            if [ "$n" = "$canary" ]; then first="${inv[$n]}" first_edge="$n"; else rest="${rest:+$rest,}${inv[$n]}"; fi
          done
          [ -n "$edges" ] || { echo "::error::no edges selected"; exit 1; }
          { echo "first=$first"; echo "canary=$first_edge"; echo "rest=$rest"; echo "edges=$edges"; } | tee -a "$GITHUB_OUTPUT"

  build:
    name: server_bin (Debian ${{ matrix.codename }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        codename: [bullseye, bookworm, trixie]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build
        env:
          # kn_rentd: the rented servers' supervisor (role kn_rentd, doc/v10/rented-servers.md)
          TARGETS: server_bin kn_rentd
          KN_CMAKE_ARGS: ${{ needs.plan.outputs.cmake_flags }}
          KN_BUILD_ROOT: ${{ runner.temp }}/kn-build
        run: deploy/ansible/build.sh "${{ matrix.codename }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.codename }}
          path: |
            dist/deploy/${{ matrix.codename }}/bin/server_bin
            dist/deploy/${{ matrix.codename }}/bin/kn_rentd
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy ${{ needs.plan.outputs.edges }}${{ inputs.dry_run && ' (dry run)' || '' }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIRST: ${{ needs.plan.outputs.first }}
      CANARY: ${{ needs.plan.outputs.canary }}
      REST: ${{ needs.plan.outputs.rest }}
      EDGES: ${{ needs.plan.outputs.edges }}
      COMMIT12: ${{ needs.plan.outputs.commit12 }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      TAGS: ${{ inputs.tags || 'firewall,fail2ban,user,release,gameserver' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync ansible-core
          ansible-galaxy collection install -r deploy/ansible/requirements.yml

      # kn_release ships dist/deploy/<codename>/bin (kn_build_codename from the host's facts)
      - uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: dist/deploy-artifacts

      - name: Stage binaries
        run: |
          set -euo pipefail
          for c in bullseye bookworm trixie; do
            install -D -m 0755 "dist/deploy-artifacts/deploy-$c/server_bin" "dist/deploy/$c/bin/server_bin"
            install -D -m 0755 "dist/deploy-artifacts/deploy-$c/kn_rentd" "dist/deploy/$c/bin/kn_rentd"
          done
          ls -la dist/deploy/*/bin

      # Keys and host keys come only from secrets (never echoed). ci_config is deploy/ansible/ssh_config
      # with kru -> KRU_HOST:KRU_PORT + its key, divide (the jump in front of kru and kn-mnz) -> its CI
      # key and the edges -> the CI edge key.
      - name: SSH setup
        env:
          EDGES_SSH_KEY: ${{ secrets.EDGES_SSH_KEY }}
          EDGES_KNOWN_HOSTS: ${{ secrets.EDGES_KNOWN_HOSTS }}
          KRU_SSH_KEY: ${{ secrets.KRU_SSH_KEY }}
          KRU_KNOWN_HOSTS: ${{ secrets.KRU_KNOWN_HOSTS }}
          KRU_HOST: ${{ secrets.KRU_HOST }}
          KRU_PORT: ${{ secrets.KRU_PORT }}
          DIVIDE_SSH_KEY: ${{ secrets.DIVIDE_SSH_KEY }}
          DIVIDE_KNOWN_HOSTS: ${{ secrets.DIVIDE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$EDGES_SSH_KEY" ] || [ -z "$EDGES_KNOWN_HOSTS" ] || [ -z "$KRU_SSH_KEY" ] || [ -z "$KRU_HOST" ] \
             || [ -z "$DIVIDE_SSH_KEY" ] || [ -z "$DIVIDE_KNOWN_HOSTS" ]; then
            echo "::error::missing EDGES_SSH_KEY / EDGES_KNOWN_HOSTS / KRU_SSH_KEY / KRU_HOST / DIVIDE_SSH_KEY / DIVIDE_KNOWN_HOSTS secret"; exit 1
          fi
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$EDGES_SSH_KEY" > ~/.ssh/id_edges; printf '%s\n' "$KRU_SSH_KEY" > ~/.ssh/id_kru
           printf '%s\n' "$DIVIDE_SSH_KEY" > ~/.ssh/id_divide)
          printf '%s\n%s\n%s\n' "$KRU_KNOWN_HOSTS" "$EDGES_KNOWN_HOSTS" "$DIVIDE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # ssh passes -F ci_config on to the ProxyJump (divide), so its block applies there too
          awk -v kh="$KRU_HOST" -v kp="${KRU_PORT:-22}" '
            $1 == "Host" { host = $2 }
            host == "kru" && $1 == "HostName" { print "  HostName " kh; print "  Port " kp; print "  IdentityFile ~/.ssh/id_kru"; print "  IdentitiesOnly yes"; next }
            host == "divide" && $1 == "IdentityFile" { print "  IdentityFile ~/.ssh/id_divide"; print "  IdentitiesOnly yes"; next }
            $1 == "IdentityFile" { print "  IdentityFile ~/.ssh/id_edges"; print "  IdentitiesOnly yes"; next }
            { print }
            END { print ""; print "Host *"; print "  StrictHostKeyChecking yes"; print "  UserKnownHostsFile ~/.ssh/known_hosts" }' \
            deploy/ansible/ssh_config > ~/.ssh/ci_config
          chmod 600 ~/.ssh/ci_config
          echo "ANSIBLE_SSH_ARGS=-F $HOME/.ssh/ci_config -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ControlMaster=auto -o ControlPersist=60s" >> "$GITHUB_ENV"

      - name: Connectivity
        working-directory: deploy/ansible
        run: ansible -m ansible.builtin.ping "kru,${FIRST:+$FIRST,}$REST"

      # Instance 1 of an edge answers the server-info query (services/scripts/kn-query.py);
      # once the new server_bin reports its commit (kn_version.h), it must be this build's (the
      # service sources' commit, version-meta.sh --server: unchanged when the push did not touch them).
      - name: Health check helper
        run: |
          cat > "$RUNNER_TEMP/edge-health.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          for edge in "$@"; do
            target="$edge-1.krunk.io:21015"
            for try in $(seq 1 18); do
              if info="$(python3 -I services/scripts/kn-query.py --json --timeout 3 "$target" 2> /dev/null)"; then
                commit="$(jq -r '.commit // empty' <<< "$info")"
                echo "$target: $(jq -c '{name, map, players, max, version, commit, protocol}' <<< "$info")"
                if [ "$DRY_RUN" != true ] && [ -n "$commit" ] && [ "${commit:0:12}" != "${COMMIT12:0:${#commit}}" ]; then
                  echo "::error::$target runs $commit, expected $COMMIT12"; exit 1
                fi
                continue 2
              fi
              sleep 5
            done
            echo "::error::$target does not answer the server-info query"; exit 1
          done
          # Krunker Strike instance 1 (kn_gameserver tasks/strike.yml, port 21115): reported, never
          # fatal (a host whose memory holds no Strike instance next to its Box Office ones runs none)
          for edge in "$@"; do
            target="$edge-1.krunk.io:21115"
            for try in $(seq 1 6); do
              if info="$(python3 -I services/scripts/kn-query.py --json --timeout 3 "$target" 2> /dev/null)"; then
                echo "$target: $(jq -c '{name, flavor, map, players, max, commit}' <<< "$info")"
                [ "$(jq -r '.flavor // empty' <<< "$info")" = strike ] || echo "::warning::$target is not a Krunker Strike server"
                continue 2
              fi
              sleep 5
            done
            echo "::warning::$target (Krunker Strike) does not answer the server-info query"
          done
          EOF
          chmod +x "$RUNNER_TEMP/edge-health.sh"

      - name: Deploy the canary first
        if: env.FIRST != ''
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          check=(); [ "$DRY_RUN" = true ] && check=(--check --diff)
          ansible-playbook edges.yml --tags "$TAGS" --limit "$FIRST" "${check[@]}"

      - name: Canary health
        if: env.FIRST != ''
        run: '"$RUNNER_TEMP/edge-health.sh" "$CANARY"'

      - name: Deploy the other edges
        if: env.REST != ''
        working-directory: deploy/ansible
        run: |
          set -euo pipefail
          check=(); [ "$DRY_RUN" = true ] && check=(--check --diff)
          ansible-playbook edges.yml --tags "$TAGS" --limit "$REST" "${check[@]}"

      - name: Health
        run: |
          set -euo pipefail
          IFS=, read -r -a edges <<< "$EDGES"
          "$RUNNER_TEMP/edge-health.sh" "${edges[@]}"

      - name: Cleanup keys
        if: always()
        run: rm -f ~/.ssh/id_edges ~/.ssh/id_kru ~/.ssh/id_divide ~/.ssh/ci_config
