name: Client

# Native client packages as public release assets (tools/release/package-client.sh): one archive per
# platform, flat (the launcher BoxOffice at the top, everything else in runtime/), and one SHA256SUMS
# for the whole release:
#   push to main, dispatch       -> rolling prerelease `client-latest`, assets replaced
#   push of a tag client-v*       -> release <tag>, kept
#
#   BoxOffice-linux-x64.tar.gz, BoxOffice-linux-arm64.tar.gz  Ubuntu 22.04 build, dynamic: distro OpenSSL 3,
#                                                             glibc 2.35+ (Ubuntu 22.04+, Debian 12+, Fedora 36+),
#                                                             WebKitGTK bundled for the captcha webview
#   BoxOffice-windows-x64.zip                                 MinGW-w64, fully static
#   BoxOffice-macos-arm64.zip, BoxOffice-macos-x64.zip        BoxOffice.app, ANGLE (Metal), static OpenSSL, macOS 11+
# plus the mobile apps (platform/README.md), WebViews over https://krunk.io/ (the web client is
# the mobile client; the native C client has no Android / iOS build):
#   BoxOffice-android.apk          release-signed with the repository key (secrets ANDROID_*,
#                                  tools/release/android-keystore.sh); skipped without the key
#   BoxOffice-ios-unsigned.ipa     unsigned: AltStore / Sideloadly sign it with the player's Apple ID
#   BoxOffice-strike-android.apk, BoxOffice-strike-ios-unsigned.ipa
#                                  the Krunker Strike apps over https://krunk.io/strike/: their own app
#                                  id (io.krunknative.strike), name and icon, installed next to Box Office
#   SHA256SUMS                     the checksums of every file above (the publish job writes it)
# The download window links all of them (client/src/ui/download_ui.c).
# The package holds the launcher (BoxOffice, BoxOffice.exe or BoxOffice.app: the entry point) and runtime/
# (client_bin, server_bin, ui/, the git-tracked part of assets/); the launcher downloads the rest of the
# game content on the first start. Each Linux job also unpacks its package in distro containers and
# runs --version (tools/release/test-client-linux.sh).
# The release notes carry the same machine-readable line as the server releases (release.yml):
#   <!-- kn-build {"describe":..,"commit":..,"commit_time":..,"build_time":..,"protocol":..} -->
# client-latest only moves forward and is never marked "Latest" (tools/release/publish.sh).
# CI never builds ANGLE (the pinned prebuilt of tools/angle/angle.lock) and caches the macOS OpenSSL.
on:
  push:
    branches: [main]
    tags: ["client-v*"]
  workflow_dispatch:

# One running + one pending run per ref: superseded pushes are skipped, a running build is never
# cancelled (agents push faster than a build takes).
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/client-v') # CI runs on main only
    runs-on: ubuntu-latest
    outputs:
      krunker_version: ${{ steps.meta.outputs.krunker_version }}
      describe: ${{ steps.meta.outputs.describe }}
      commit: ${{ steps.meta.outputs.commit }}
      commit12: ${{ steps.meta.outputs.commit12 }}
      commit_time: ${{ steps.meta.outputs.commit_time }}
      build_time: ${{ steps.meta.outputs.build_time }}
      protocol: ${{ steps.meta.outputs.protocol }}
      cmake_flags: ${{ steps.meta.outputs.cmake_flags }}
      kn_build: ${{ steps.meta.outputs.kn_build }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags

      - name: Version metadata
        id: meta
        run: |
          set -euo pipefail
          tools/release/version-meta.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag=client-latest; fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

  # The Linux client per arch on Ubuntu 22.04 (tools/release/build-client-linux.sh dynamic), natively on an
  # x86_64 and an arm64 runner: distro OpenSSL 3 (libssl3), glibc 2.35+, and WebKitGTK bundled (lib/,
  # libexec/, tools/release/bundle-webkit.sh) so the captcha webview works with no install. Every Linux
  # client archive is this build; there is no polyfilled client (the server has one: release.yml).
  linux:
    name: Linux ${{ matrix.platform }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      KN_CMAKE_ARGS: ${{ needs.meta.outputs.cmake_flags }}
      KN_COMMIT: ${{ needs.meta.outputs.commit }}
      KN_COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
      KN_BUILD_TIME: ${{ needs.meta.outputs.build_time }}
      KN_PROTOCOL: ${{ needs.meta.outputs.protocol }}
      CHANNEL: ${{ needs.meta.outputs.tag == 'client-latest' && 'latest' || needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (dynamic, WebKitGTK bundled)
        run: tools/release/build-client-linux.sh --deps dynamic "$RUNNER_TEMP/bin/dynamic"

      - name: Package
        run: |
          set -euo pipefail
          tools/release/package-client.sh "${{ matrix.platform }}" "$RUNNER_TEMP/bin/dynamic" out --channel "$CHANNEL"
          cat "$RUNNER_TEMP"/bin/*/build-info.txt
          # the captcha webview works with no install: every Linux client carries WebKitGTK
          test -f "$RUNNER_TEMP/bin/dynamic/webkit-bundle.txt" || { echo "::error title=Package::no WebKitGTK bundle (bundle-webkit.sh)"; exit 1; }
          ls -la out
          # every git-tracked assets/ file ships (the launcher's content index leaves them out, so a
          # tracked file missing here reaches no native player: titles.json, sounds/kn_*.mp3 did)
          missing="$(comm -23 <(git ls-files assets | grep -vx assets/README.md | sort) \
            <(tar -tzf "out/BoxOffice-${{ matrix.platform }}.tar.gz" | sed -n 's|^runtime/||p' | grep '^assets/' | sort))"
          [ -z "$missing" ] || { echo "::error title=Package::tracked assets missing from the package: $missing"; exit 1; }

      # Unpack the package the way users do, in distro containers, and run --version (no game content
      # in CI, so no render: tools/release/test-client-linux.sh with a content dir does that locally).
      # glibc 2.35 and OpenSSL 3 are the floor: the build host is Ubuntu 22.04.
      - name: Distro compatibility
        run: |
          set -euo pipefail
          a="${{ matrix.platform }}"
          {
            echo "ubuntu:22.04 out/BoxOffice-$a.tar.gz"
            echo "debian:bookworm out/BoxOffice-$a.tar.gz"
            echo "debian:trixie out/BoxOffice-$a.tar.gz"
            echo "fedora:latest out/BoxOffice-$a.tar.gz"
          } > compat.txt
          # xargs runs them 4 at a time; any failed install or --version fails the job. A failing
          # distro prints its RESULT line and the tail of its test.log (prefixed "[<image> <package>]")
          # into this log, and gets an error annotation.
          rc=0
          xargs -P 4 -L 1 tools/release/test-client-linux.sh < compat.txt | tee compat-results.txt || rc=$?
          { echo "### Linux $a package"; echo '```'; cat "$RUNNER_TEMP"/bin/*/build-info.txt compat-results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -v 'version=ok' compat-results.txt | sed 's/^/::error title=Distro compatibility::/' || true
          [ "$rc" = 0 ] && [ "$(grep -c 'version=ok' compat-results.txt)" = "$(wc -l < compat.txt)" ]

      # The packaged launcher reaches the live updates server (dl.krunk.io) and reads its manifest:
      # its own DNS lookup, TLS and redirects on this platform (tools/release/check-launcher.sh;
      # 2026-10-13 "the box office updater fails to connect to the server"). An outage of kru must
      # not hold back a release, so a failure is an error annotation, not a failed job.
      - name: Launcher reaches the updates server
        continue-on-error: true
        run: |
          set -euo pipefail
          tools/release/check-launcher.sh "out/BoxOffice-${{ matrix.platform }}.tar.gz" --old-url \
            || { echo "::error title=Updates server::the ${{ matrix.platform }} launcher could not read the updates manifest"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: client-pkg-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows amd64 (MinGW-w64)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    env:
      KN_CMAKE_ARGS: ${{ needs.meta.outputs.cmake_flags }}
      KN_COMMIT: ${{ needs.meta.outputs.commit }}
      KN_COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
      KN_BUILD_TIME: ${{ needs.meta.outputs.build_time }}
      KN_PROTOCOL: ${{ needs.meta.outputs.protocol }}
      CHANNEL: ${{ needs.meta.outputs.tag == 'client-latest' && 'latest' || needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            zip
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      # -static: no libgcc/libstdc++/winpthread DLLs; FreeType without its optional DLLs.
      # Workspace-relative paths: $RUNNER_TEMP is a D:\ path in the MSYS2 shell.
      - name: Build
        run: tools/release/build-client.sh windows win-bin

      # The brain transport (WinHTTP, client/src/net/backend_winhttp.c) is really in client.exe and
      # works: client.exe once shipped backend_native.c's Windows stubs (no account service, an
      # empty server finder, a game connection to 127.0.0.1).
      - name: Windows brain transport
        run: |
          set -euo pipefail
          ./build-windows/backend_online_test.exe
          for s in '[backend] brain %s' WinHttpWebSocketCompleteUpgrade '[http] %s %s failed: %s'; do
            grep -qaF "$s" win-bin/client.exe || { echo "client.exe lacks the brain transport ($s)" >&2; exit 1; }
          done

      - name: Package
        run: |
          set -euo pipefail
          tools/release/package-client.sh windows-x64 win-bin out --channel "$CHANNEL"
          mkdir t && unzip -q out/BoxOffice-windows-x64.zip -d t
          ldd t/runtime/client.exe
          t/runtime/client.exe --version
          t/runtime/client.exe --voice-info | grep '^opus=libopus ' # voice chat's codec
          t/runtime/server.exe --version
          t/BoxOffice.exe --version

      # The packaged launcher reaches the live updates server (dl.krunk.io) and reads its manifest:
      # its own DNS lookup, TLS and redirects on this platform (tools/release/check-launcher.sh;
      # 2026-10-13 "the box office updater fails to connect to the server"). An outage of kru must
      # not hold back a release, so a failure is an error annotation, not a failed job.
      - name: Launcher reaches the updates server
        continue-on-error: true
        run: |
          tools/release/check-launcher.sh out/BoxOffice-windows-x64.zip --old-url \
            || { echo "::error title=Updates server::the Windows launcher (WinHTTP) could not read the updates manifest"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: client-pkg-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.platform }} (ANGLE/Metal)
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            angle: macos-arm64
            runner: macos-latest
          # macos-15-intel is the supported x86_64 label until ~Aug 2027
          - platform: macos-x64
            angle: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-dist
      KN_OPENSSL_PREFIX: ${{ github.workspace }}/openssl-dist
      KN_CMAKE_ARGS: ${{ needs.meta.outputs.cmake_flags }}
      KN_COMMIT: ${{ needs.meta.outputs.commit }}
      KN_COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
      KN_BUILD_TIME: ${{ needs.meta.outputs.build_time }}
      KN_PROTOCOL: ${{ needs.meta.outputs.protocol }}
      CHANNEL: ${{ needs.meta.outputs.tag == 'client-latest' && 'latest' || needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # A package without ANGLE would not render: no prebuilt for this arch fails the job.
      - name: Fetch prebuilt ANGLE
        run: |
          set -euo pipefail
          out="$(tools/angle/fetch-angle.sh "${{ matrix.angle }}" "$ANGLE_DIR")"
          [ "$out" = available=true ] || { echo "::error::no prebuilt ANGLE for ${{ matrix.angle }} in tools/angle/angle.lock"; exit 1; }

      # build-openssl.sh's static OpenSSL (macOS 11.0 target), ~5 min to build, cached per pin
      - name: Cache OpenSSL
        uses: actions/cache@v6
        with:
          path: ${{ env.KN_OPENSSL_PREFIX }}
          key: openssl-${{ hashFiles('tools/release/build-openssl.sh') }}-${{ matrix.platform }}

      # The runner images ship cmake, ninja and pkg-config: install only what is missing and
      # never `brew update`/upgrade (build.yml).
      - name: Build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euo pipefail
          missing=()
          for tool in cmake ninja pkg-config; do command -v "$tool" > /dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then brew install "${missing[@]}"; fi

      - name: Build
        run: tools/release/build-client.sh macos "$RUNNER_TEMP/bin"

      - name: Package
        run: |
          set -euo pipefail
          tools/release/package-client.sh "${{ matrix.platform }}" "$RUNNER_TEMP/bin" out --channel "$CHANNEL"
          # the packaged app runs from anywhere with its bundled dylibs only
          mkdir t && unzip -q "out/BoxOffice-${{ matrix.platform }}.zip" -d t
          codesign --verify --deep --strict t/BoxOffice.app
          (cd / && "$GITHUB_WORKSPACE/t/runtime/client_bin" --version)
          (cd / && "$GITHUB_WORKSPACE/t/runtime/client_bin" --voice-info) | grep '^opus=libopus '
          otool -L t/runtime/client_bin

      # The packaged launcher reaches the live updates server (dl.krunk.io) and reads its manifest:
      # its own DNS lookup, TLS and redirects on this platform (tools/release/check-launcher.sh;
      # 2026-10-13 "the box office updater fails to connect to the server"). An outage of kru must
      # not hold back a release, so a failure is an error annotation, not a failed job.
      - name: Launcher reaches the updates server
        continue-on-error: true
        run: |
          tools/release/check-launcher.sh "out/BoxOffice-${{ matrix.platform }}.zip" --old-url \
            || { echo "::error title=Updates server::the ${{ matrix.platform }} launcher could not read the updates manifest"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: client-pkg-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # The Android app as a thin release APK: it opens https://krunk.io/ (no bundled web client,
  # app/build.gradle.kts bundleWeb), versionCode = commit time in minutes so every build installs
  # over the previous one. The key must stay the same forever (Android refuses an update signed
  # with another key): tools/release/android-keystore.sh made it, the secrets carry it.
  android:
    name: Android (signed APK)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KN_KRUNKER_VERSION: ${{ needs.meta.outputs.krunker_version }}
      KN_COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
    steps:
      - uses: actions/checkout@v7

      - name: Signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: no Android APK in this release (tools/release/android-keystore.sh)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KN_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        if: steps.key.outputs.signed == 'true'
        with:
          distribution: temurin
          java-version: 21

      # v3 installs the long-removed `tools` package by default and fails in sdkmanager (build.yml).
      - name: Setup Android SDK
        if: steps.key.outputs.signed == 'true'
        uses: android-actions/setup-android@v4

      - name: Build release APK
        if: steps.key.outputs.signed == 'true'
        working-directory: platform/android
        env:
          KN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # each build empties outputs/apk/release: keep every APK as it is built
          mkdir -p "$RUNNER_TEMP/apk"
          ./gradlew --no-daemon assembleRelease -Pkrunknative.serverUrl=https://krunk.io/ \
            -Pkrunknative.versionCode=$((KN_COMMIT_TIME / 60)) -Pkrunknative.versionName="$KN_KRUNKER_VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/BoxOffice-android.apk"
          # Krunker Strike (io.krunknative.strike) over its own page
          ./gradlew --no-daemon assembleRelease -Pkrunknative.app=strike -Pkrunknative.serverUrl=https://krunk.io/strike/ \
            -Pkrunknative.versionCode=$((KN_COMMIT_TIME / 60)) -Pkrunknative.versionName="$KN_KRUNKER_VERSION"
          cp app/build/outputs/apk/release/app-strike-release.apk "$RUNNER_TEMP/apk/BoxOffice-strike-android.apk"

      - name: Check the signature
        if: steps.key.outputs.signed == 'true'
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          mkdir -p out
          for name in BoxOffice-android BoxOffice-strike-android; do
            "$apksigner" verify --print-certs "$RUNNER_TEMP/apk/$name.apk"
            cp "$RUNNER_TEMP/apk/$name.apk" out/
          done

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed == 'true'
        with:
          name: client-pkg-android
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # The iOS app as an unsigned device build over https://krunk.io/ (KN_SERVER_URL, no bundled web
  # client). iOS installs only signed apps: sideloading tools re-sign it with the player's Apple ID
  # (free accounts: 7 days). The Download window offers Add to Home Screen (the PWA) first.
  ios:
    name: iOS (unsigned .ipa)
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KN_KRUNKER_VERSION: ${{ needs.meta.outputs.krunker_version }}
      KN_COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: brew install xcodegen

      # an empty web/ folder reference: the app opens KN_SERVER_URL
      - name: Generate the Xcode project
        working-directory: platform/ios
        run: |
          mkdir -p web
          xcodegen generate

      - name: Build for devices (unsigned)
        working-directory: platform/ios
        run: |
          set -o pipefail
          xcodebuild -project KrunkNative.xcodeproj -scheme KrunkNative -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            KN_SERVER_URL=https://krunk.io/ MARKETING_VERSION=$KN_KRUNKER_VERSION CURRENT_PROJECT_VERSION=$((KN_COMMIT_TIME / 60)) build
          # Krunker Strike (io.krunknative.strike) over its own page
          xcodebuild -project KrunkNative.xcodeproj -scheme KrunkStrike -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            KN_SERVER_URL=https://krunk.io/strike/ MARKETING_VERSION=$KN_KRUNKER_VERSION CURRENT_PROJECT_VERSION=$((KN_COMMIT_TIME / 60)) build

      - name: Package (.ipa)
        run: |
          set -euo pipefail
          mkdir -p out
          # <app>:<ipa name>:<KNServerURL>
          for t in KrunkNative:BoxOffice-ios-unsigned:https://krunk.io/ KrunkStrike:BoxOffice-strike-ios-unsigned:https://krunk.io/strike/; do
            app=${t%%:*}; rest=${t#*:}; ipa=${rest%%:*}; url=${rest#*:}
            rm -rf ipa && mkdir -p ipa/Payload
            cp -R "platform/ios/build/Build/Products/Release-iphoneos/$app.app" ipa/Payload/
            /usr/libexec/PlistBuddy -c 'Print :KNServerURL' "ipa/Payload/$app.app/Info.plist" | grep -qx "$url"
            (cd ipa && zip -qr9y "../out/$ipa.ipa" Payload)
          done
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: client-pkg-ios
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # client-latest publishes once the Linux packages are in: a platform whose build failed is left
  # out of this run (publish.sh removes its old assets: no mixed versions) and named in the notes.
  # client-v* releases need every platform.
  publish:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, linux, windows, macos, android, ios]
    if: >-
      !cancelled() && needs.meta.result == 'success' && needs.linux.result == 'success' &&
      (needs.meta.outputs.tag == 'client-latest' || (needs.windows.result == 'success' && needs.macos.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload, moving the client-latest tag
    concurrency:
      group: publish-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      COMMIT12: ${{ needs.meta.outputs.commit12 }}
      COMMIT_TIME: ${{ needs.meta.outputs.commit_time }}
      BUILD_TIME: ${{ needs.meta.outputs.build_time }}
      KRUNKER_VERSION: ${{ needs.meta.outputs.krunker_version }}
      PROTOCOL: ${{ needs.meta.outputs.protocol }}
      KN_BUILD: ${{ needs.meta.outputs.kn_build }}
      BRANCH: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: client-pkg-*
          path: release-assets
          merge-multiple: true

      # One SHA256SUMS for the release, over every asset of this run (sha256sum format, names only).
      - name: Checksums
        run: |
          set -euo pipefail
          ls -la release-assets
          cd release-assets
          files=()
          for f in *; do [ "$f" = SHA256SUMS ] || files+=("$f"); done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          cd ..


      - name: Release notes
        run: |
          set -euo pipefail
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          row() { # row <label> <platform> <ext>: the platform's archive
            local label="$1" plat="$2" ext="$3" f
            f="BoxOffice-$plat.$ext"
            if [ -f "release-assets/$f" ]; then echo "| $label | [$ext]($base/$f) |"
            else echo "| $label | not built in this run ([build failed]($RUN_URL)) |"; fi
          }
          app_row() { # app_row <label> <file> <note>: the mobile apps
            if [ -f "release-assets/$2" ]; then echo "| $1 | [${2##*.}]($base/$2) $3 |"
            else echo "| $1 | not in this run ([run]($RUN_URL)) |"; fi
          }
          {
            if [ "$TAG" = client-latest ]; then
              echo "Rolling build of the Krunker Box Office game client, replaced on every push to \`main\`. Clients that run an older build or protocol than this are flagged outdated."
            else
              echo "Krunker Box Office game client $TAG."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`$COMMIT12\`](https://github.com/$GH_REPO/commit/$COMMIT) ($BRANCH) |"
            echo "| Version | Krunker $KRUNKER_VERSION |"
            echo "| Protocol | $PROTOCOL (NET_PROTOCOL_MAJOR.MINOR) |"
            echo "| Built | $BUILD_TIME ([run]($RUN_URL)) |"
            echo
            echo "| Platform | Downloads |"
            echo "|---|---|"
            row "Linux x64 (glibc 2.35+: Ubuntu 22.04+, Debian 12+, Fedora 36+)" linux-x64 tar.gz
            row "Linux arm64 (glibc 2.35+: Ubuntu 22.04+, Debian 12+, Fedora 36+)" linux-arm64 tar.gz
            row "Windows 10+ x64" windows-x64 zip
            row "macOS 11+ Apple silicon" macos-arm64 zip
            row "macOS 11+ Intel" macos-x64 zip
            app_row "Android 7.0+" BoxOffice-android.apk "the app plays krunk.io fullscreen"
            app_row "iPhone / iPad (sideload)" BoxOffice-ios-unsigned.ipa "unsigned: AltStore / Sideloadly sign it; or open krunk.io in Safari, Share > Add to Home Screen"
            app_row "Krunker Strike, Android 7.0+" BoxOffice-strike-android.apk "its own app (io.krunknative.strike), next to Box Office: plays krunk.io/strike fullscreen"
            app_row "Krunker Strike, iPhone / iPad (sideload)" BoxOffice-strike-ios-unsigned.ipa "unsigned; or open krunk.io/strike in Safari, Share > Add to Home Screen"
            echo
            echo "Unpack the archive into a folder of its own, then run \`./BoxOffice\` (Linux), double-click \`BoxOffice.exe\` (Windows) or open \`BoxOffice.app\` (macOS, unsigned: right-click > Open the first time). The first start downloads the game content (about 1.7 GB); the launcher keeps the client up to date. README.txt in each package has the details. Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\` against [SHA256SUMS]($base/SHA256SUMS)."
            echo
            echo "Phones and tablets play the web client: Android, install the APK (allow your browser to install apps when asked); iPhone / iPad, open https://krunk.io in Safari and tap Share > Add to Home Screen (the .ipa is for sideloading tools only). Krunker Strike is its own app the same way (the strike APK, or https://krunk.io/strike/ > Add to Home Screen) and installs next to Krunker Box Office."
            echo
            echo "<!-- kn-build $KN_BUILD -->"
          } > notes.md
          cat notes.md

      # tools/release/publish.sh: assets first (replaced in place), then the notes with the
      # kn-build line, then the tag; client-latest only moves forward.
      - name: Publish
        run: |
          set -euo pipefail
          if [ "$TAG" = client-latest ]; then title="Krunker Box Office client (latest build)"; else title="Krunker Box Office client ${TAG#client-}"; fi
          tools/release/publish.sh "$TAG" "$title" notes.md release-assets/*
          echo "### [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG): $COMMIT12, protocol $PROTOCOL" >> "$GITHUB_STEP_SUMMARY"

  # Updates server (doc/backend.md 9.8): this run's update packages to kru, then `kn-updates publish`
  # there writes https://dl.krunk.io/updates/client/latest.json. The game content is indexed on kru
  # from its web asset tree; the assets/ files the packages ship are left out of it.
  updates:
    name: Upload to the updates server
    needs: [meta, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' &&
      vars.KN_UPDATES_UPLOAD == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: updates-upload
      cancel-in-progress: false
    env:
      KN_BUILD: ${{ needs.meta.outputs.kn_build }}
      COMMIT12: ${{ needs.meta.outputs.commit12 }}
      KRU_HOST: ${{ secrets.KRU_HOST }}
      KRU_PORT: ${{ secrets.KRU_PORT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: client-pkg-*
          path: client-pkg
          merge-multiple: true

      # BoxOffice-<platform>.{tar.gz,zip}: the archive of each platform is its update package; every file
      # is linked from the manifest on the GitHub release.
      - name: Stage (update packages + build.json)
        run: >-
          python3 -I tools/release/kn-updates.py stage --kn-build "$KN_BUILD" --packages client-pkg
          --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/client-latest"
          --out "stage/$COMMIT12"

      - name: SSH setup
        env:
          KRU_SSH_KEY: ${{ secrets.KRU_SSH_KEY }}
          KRU_KNOWN_HOSTS: ${{ secrets.KRU_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KRU_SSH_KEY" > ~/.ssh/id_kru
          chmod 600 ~/.ssh/id_kru
          printf '%s\n' "$KRU_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # kn-updates publish: verifies the packages, indexes the content, writes the manifest last and
      # only moves forward (an older commit than the published one is skipped).
      - name: Upload and publish
        run: |
          set -euo pipefail
          ssh_cmd="ssh -i $HOME/.ssh/id_kru -p ${KRU_PORT:-22} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          rsync -rt --chmod=D755,F644 -e "$ssh_cmd" "stage/$COMMIT12/" "root@$KRU_HOST:/opt/krunknative-updates/incoming/$COMMIT12/"
          $ssh_cmd "root@$KRU_HOST" /usr/local/bin/kn-updates publish "/opt/krunknative-updates/incoming/$COMMIT12"
          echo "### updates: published $COMMIT12 to https://dl.krunk.io/updates/client/latest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_kru
