name: Deploy kru

# Push to main (or a manual run): build the web client + services, run deploy/ansible/central.yml against
# the central node (assets., matchmaker., coordinator.krunk.io, play.krunk.io), then publish
# the front end (krunk.io, deploy/pages/README.md "GitHub Pages"): GitHub Pages (job `pages`, once the
# repository variable GH_PAGES is 1) and, until KN_CF_FRONTEND is 0, the old Cloudflare Pages
# project too. After the services, so a new page never talks to old ones. The site settings
# (asset origins, ...) are repository variables, deploy/pages/site.sh; pages.yml republishes
# this build with changed ones, without a build.
# Secrets: KRU_SSH_KEY (private key for root@kru), KRU_HOST, KRU_PORT, KRU_KNOWN_HOSTS,
#          CLOUDFLARE_API_TOKEN (Pages: Edit + Zone Read/Cache Purge on krunk.io), CLOUDFLARE_ACCOUNT_ID,
#          optional KN_SMTP_HOST, KN_SMTP_PORT, KN_SMTP_TLS, KN_SMTP_USER, KN_SMTP_PASSWORD, KN_SMTP_FROM
#          (kn_brain's outbound mail -> /etc/krunknative/smtp.env; deploy/ansible/README.md).
# kn-brain runs --migrate, so a deploy applies new DB migrations. A successful run starts
# Deploy edges (workflow_run), so the game servers follow the services.
# Services restart only when what they run changed (players are dropped by a restart): the
# kn_brain / kn_migrate build is reproducible and stamped with the last commit that changed the
# service sources (tools/release/version-meta.sh --server), the release dir is named by its content
# (role kn_release), kn-rtc builds without VCS stamping and the net-bridge bundle is deterministic,
# so a push that only touches the web client, docs or other settings copies nothing and restarts
# nothing. A gateway that must restart tells its players why first (GAME UPDATING) and they rejoin.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kru
  cancel-in-progress: false

permissions:
  contents: read

env:
  EM_VERSION: 6.0.12
  EM_CACHE_FOLDER: emsdk-cache
  # Go for the WebTransport relay and the WebRTC gateway (net-bridge/wt, net-bridge/rtc: kn-rtc,
  # --tags rtc) that central.yml builds on the controller: must equal the `go` line of their
  # go.mod files (checked in the deploy job). Bump together with them.
  GO_VERSION: 1.26.0

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' # deploys only from main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # the published site's settings (deploy/pages/site.sh; empty = its default)
    env:
      KN_ASSET_ORIGIN: ${{ vars.KN_ASSET_ORIGIN }}
      KN_ASSET_FALLBACK: ${{ vars.KN_ASSET_FALLBACK }}
      KN_ASSET_OWN_URL: ${{ vars.KN_ASSET_OWN_URL }}
      KN_ASSET_CDN_URL: ${{ vars.KN_ASSET_CDN_URL }}
      KN_PAGES_CNAME: ${{ vars.KN_PAGES_CNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # version-meta.sh --server: the last commit that changed the service sources

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rsync ansible-core
          ansible-galaxy collection install -r deploy/ansible/requirements.yml

      - name: Cache emsdk
        uses: actions/cache@v6
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: emsdk-${{ env.EM_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      - name: Build web client (dist/web)
        run: make web

      # Debian bookworm container: same glibc/OpenSSL as kru. Stamped with the service sources'
      # own commit and its time, so an unchanged source builds a byte-identical kn_brain (no restart).
      - name: Version metadata (service binaries)
        id: meta
        run: tools/release/version-meta.sh --server "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Build services (dist/deploy/bookworm)
        env:
          KN_CMAKE_ARGS: ${{ steps.meta.outputs.cmake_flags }}
        run: TARGETS="kn_brain kn_migrate" deploy/ansible/build.sh bookworm

      # Pinned Go, never the runner's preinstalled one; GOTOOLCHAIN=local so a go.mod asking
      # for a newer Go fails here instead of silently downloading another toolchain.
      - name: Check the Go pin against net-bridge/*/go.mod
        run: |
          set -euo pipefail
          for mod in net-bridge/*/go.mod; do
            want="$(awk '$1 == "go" { print $2 }' "$mod")"
            echo "$mod: go $want"
            [ "$want" = "$GO_VERSION" ] || { echo "::error file=$mod::go $want, deploy-kru.yml pins GO_VERSION=$GO_VERSION"; exit 1; }
          done

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
          cache-dependency-path: net-bridge/*/go.sum

      - name: Go toolchain
        run: |
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go version

      - name: SSH setup
        env:
          KRU_SSH_KEY: ${{ secrets.KRU_SSH_KEY }}
          KRU_KNOWN_HOSTS: ${{ secrets.KRU_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KRU_SSH_KEY" > ~/.ssh/id_kru
          chmod 600 ~/.ssh/id_kru
          printf '%s\n' "$KRU_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Assets are only in the checkout as the tracked subset (maps, shaders, skins):
      # the 1.5 GB content tree already on kru is left as is (kn_web_sync_assets=false).
      - name: Deploy (ansible central.yml)
        working-directory: deploy/ansible
        env:
          KRU_HOST: ${{ secrets.KRU_HOST }}
          KRU_PORT: ${{ secrets.KRU_PORT }}
          KN_SMTP_HOST: ${{ secrets.KN_SMTP_HOST }}
          KN_SMTP_PORT: ${{ secrets.KN_SMTP_PORT }}
          KN_SMTP_TLS: ${{ secrets.KN_SMTP_TLS }}
          KN_SMTP_USER: ${{ secrets.KN_SMTP_USER }}
          KN_SMTP_PASSWORD: ${{ secrets.KN_SMTP_PASSWORD }}
          KN_SMTP_FROM: ${{ secrets.KN_SMTP_FROM }}
        run: |
          # Overrides ansible.cfg's `-F ssh_config` (the runner has no host aliases).
          export ANSIBLE_SSH_ARGS="-F /dev/null -i $HOME/.ssh/id_kru -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ControlMaster=auto -o ControlPersist=60s"
          ansible-playbook central.yml \
            -e "ansible_host=$KRU_HOST" -e "ansible_port=${KRU_PORT:-22}" \
            -e kn_web_sync_assets=false -e "kn_release_id=${GITHUB_SHA::12}"

      # Front end, after central.yml so the services and the own asset origin (assets.krunk.io =
      # kru) are current first. GitHub Pages: staged here (before the Cloudflare deploy below,
      # whose krunk.io is the live site until the DNS moves: github.sh keeps its client files
      # for cached pages), published by the job `pages`.
      - name: Stage front end (GitHub Pages)
        if: vars.GH_PAGES == '1'
        run: deploy/pages/github.sh

      - name: Upload GitHub Pages artifact
        if: vars.GH_PAGES == '1'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/gh-pages

      # The unstaged build, for pages.yml (republish with other settings, no build).
      - name: Upload web build (for pages.yml)
        uses: actions/upload-artifact@v7
        with:
          name: KrunkNative-web-deployed
          path: |
            dist/web/
            !dist/web/assets
            !dist/web/assets/**
          retention-days: 30
          if-no-files-found: error

      # The old front end: dist/web -> Cloudflare Pages project krunknative (krunk.io, www. while
      # the DNS points there). KN_CF_FRONTEND=0 stops it (README "Cutover", last step).
      # Secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.
      - uses: actions/setup-node@v7
        if: vars.KN_CF_FRONTEND != '0'
        with:
          node-version: 22

      - name: Deploy front end (Cloudflare Pages)
        if: vars.KN_CF_FRONTEND != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: deploy/pages/deploy.sh

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/id_kru

  # The front end on GitHub Pages (deploy/pages/README.md "GitHub Pages"): publishes the artifact the
  # deploy job staged. Needs Pages enabled with build_type=workflow and GH_PAGES=1.
  pages:
    needs: deploy
    if: github.ref == 'refs/heads/main' && vars.GH_PAGES == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
