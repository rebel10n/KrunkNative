# CORS headers - applies to all responses (incl. 4xx/5xx), in the server block that includes it.
# The origin is echoed only for the page origins below, never "*": the KN front ends
# (kn_web_origins) and the official Krunker page (kn_official_page_origins). An origin that is
# not listed gets no Access-Control-Allow-Origin (the empty value is not sent).
# The lists are the ones in deploy/ansible/group_vars/all.yml; keep them in step.
# kn_brain answers CORS for its own routes (brain.cors_origins, same lists): a vhost that proxies
# to kn_brain must not include this file as well, or the header is sent twice.
set $kn_cors_origin "";
if ($http_origin = "https://krunk.io")              { set $kn_cors_origin $http_origin; }
if ($http_origin = "https://www.krunk.io")          { set $kn_cors_origin $http_origin; }
if ($http_origin = "https://rebel10n.github.io")    { set $kn_cors_origin $http_origin; }
if ($http_origin = "https://krunker.party")         { set $kn_cors_origin $http_origin; }
if ($http_origin = "https://krunker.io")            { set $kn_cors_origin $http_origin; }
if ($http_origin = "https://www.krunker.io")        { set $kn_cors_origin $http_origin; }
add_header 'Access-Control-Allow-Origin'  $kn_cors_origin always;
add_header 'Vary'                         'Origin' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Cache-Control, Range, If-Modified-Since' always;
add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
add_header 'Access-Control-Max-Age'       '86400' always;
