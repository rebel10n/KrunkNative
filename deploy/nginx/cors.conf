# CORS headers - applies to all responses (incl. 4xx/5xx). Same as the v3.1.1
# jail's ansible/files/nginx/cors.conf. kn_brain also answers CORS itself
# (brain.cors_origins); keep only one of the two if you restrict origins.
add_header 'Access-Control-Allow-Origin'  '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin, Cache-Control, Range, If-Modified-Since' always;
add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
add_header 'Access-Control-Max-Age'       '86400' always;
