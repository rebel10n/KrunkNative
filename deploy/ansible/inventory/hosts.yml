# KrunkNative inventory. Host names are ssh_config aliases.
all:
  children:
    central:
      hosts:
        kru:
          # ssh_config alias; CI passes -e ansible_host=$KRU_HOST -e ansible_port=$KRU_PORT.
          ansible_host: kru
          ansible_user: root
    edges:
      hosts:
        com.clara:
          kn_edge_name: clara
          kn_public_ip: 92.38.149.24
        com.angeles:
          kn_edge_name: angeles
          kn_public_ip: 92.223.30.23
        com.chitown:
          kn_edge_name: chitown
          kn_public_ip: 2.56.222.45
        amph.ashburn:
          kn_edge_name: ashburn
          kn_public_ip: 45.82.161.87
          # nftables here is owned by abulxt's Ansible (policy drop, flush ruleset):
          # instances stay down until 21015.. tcp+udp is opened there.
          kn_gameserver_ports_open: false
