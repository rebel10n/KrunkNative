# KrunkNative inventory. Host names are ssh_config aliases.
#
# Edge game servers: group `edges` (what edges.yml, firewall.yml, fail2ban.yml and kru's
# net-bridge / kn-rtc allowlists use; group_vars/edges/main.yml applies to all of it) has one
# child:
#   edges_kn   dedicated KrunkNative VMs (kn-<site>) on the wisp Proxmox hosts. KrunkNative is the
#              only tenant: it owns the edge_firewall and fail2ban base there
#              (group_vars/edges_kn/main.yml).
# The old G-Core VPSs shared with abulxt (edges_old: clara, angeles, chitown, ashburn) are gone:
# cancelled 2026-11-13.
all:
  children:
    central:
      hosts:
        kru:
          # ssh_config alias; CI passes -e ansible_host=$KRU_HOST -e ansible_port=$KRU_PORT.
          ansible_host: kru
          ansible_user: root
    edges:
      children:
        edges_kn:
          hosts:
            # kn_public_ip is the address the game sockets bind to and <edge>-<n>.krunk.io points at.
            # A host without it is left out of kru's net-bridge / kn-rtc allowlists (roles kn_bridge,
            # kn_rtc). kn_gameserver_count: server_bin (Box Office) instances, ports 21015.. (at most 11
            # while kn_bridge/kn_rtc_target_port_hi is 21025).
            kn-mia:
              kn_edge_name: mia
              kn_gameserver_region: MI  # Miami (new code: client/src/ui/region_names.c, services/brain/registry.c)
              kn_public_ip: 45.92.71.48  # was wisp-mia's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3    # 4 vCPU VM (the user's choice, 2026-11-12): vcpus - 1
            kn-iev:
              kn_edge_name: iev
              kn_gameserver_region: KV  # Kyiv (new code, as MI)
              kn_public_ip: 185.101.138.155  # was wisp-iev's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3    # 4 vCPU VM (the user's choice, 2026-11-12): vcpus - 1
            # 2026-11-13, the user's choice: every wisp site gets a kn VM of the same size.
            kn-mnz:
              kn_edge_name: ashburn     # Ashburn/Manassas: ashburn-<n>.krunk.io, "Ashburn #<n>" as before
              kn_gameserver_region: VA  # Ashburn, Virginia
              kn_public_ip: 5.188.124.94  # VM 123 on meal (not an hv-<site>; abulxt [kn_vm_meal]), hd's .94
              kn_gameserver_count: 3
            kn-jnb:
              kn_edge_name: jnb
              kn_gameserver_region: JN  # Johannesburg (af-ct, alias me-bhn; services/brain/registry.c)
              kn_public_ip: 5.188.120.31  # was wisp-jnb's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3
            kn-ams:
              kn_edge_name: ams
              kn_gameserver_region: AM  # Amsterdam (de-fra, with Kyiv)
              kn_public_ip: 92.38.186.100  # was wisp-ams's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3
