# KrunkNative inventory. Host names are ssh_config aliases.
#
# Edge game servers: group `edges` (what edges.yml, firewall.yml, fail2ban.yml and kru's
# net-bridge / kn-rtc allowlists use; group_vars/edges/main.yml applies to all of it) has one
# child:
#   edges_kn   KrunkNative's own kn-<site> machines: VMs on the wisp Proxmox hosts, where KrunkNative
#              is the only tenant and owns the edge_firewall and fail2ban base
#              (group_vars/edges_kn/main.yml), and kn-mnz, a container on divide (below).
# The old G-Core VPSs shared with abulxt (edges_old: clara, angeles, chitown, ashburn) are gone:
# cancelled 2026-11-13.
#
# Guests of the Proxmox host divide (91.199.82.174, its only public address): group `divide`,
# kru (CT 120) and kn-mnz (CT 203) since the move off meal on 2026-11-16. They sit on divide's NAT
# bridge (vmbr1, 172.16.5.0/24, gateway 172.16.5.1), are reached over SSH through divide
# (kn_ssh_jump) and are firewalled by divide's pve-firewall (/etc/pve/firewall/<vmid>.fw), never
# from inside: no edge_firewall and no fail2ban there (kn_host_firewall, group_vars/divide/main.yml).
all:
  children:
    central:
      hosts:
        kru:
          # ssh_config alias (172.16.5.47 through divide); CI passes -e ansible_host=$KRU_HOST
          # -e ansible_port=$KRU_PORT (KRU_HOST = that LAN address, the jump comes from group divide).
          ansible_host: kru
          ansible_user: root
    edges:
      children:
        edges_kn:
          hosts:
            # kn_public_ip is the address <edge>-<n>.krunk.io points at, and the one the game sockets
            # bind to unless kn_listen_ip says otherwise (a host behind NAT). A host without it is left
            # out of kru's net-bridge / kn-rtc allowlists (roles kn_bridge, kn_rtc).
            # kn_gameserver_count: server_bin (Box Office) instances, ports 21015.. (at most 11 while
            # kn_bridge/kn_rtc_target_port_hi is 21025).
            kn-mia:
              kn_edge_name: mia
              kn_gameserver_region: MI  # Miami (new code: client/src/ui/region_names.c, services/brain/registry.c)
              kn_public_ip: 45.92.71.48  # was wisp-mia's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3    # 4 vCPU VM (the user's choice, 2026-11-12): vcpus - 1
            kn-iev:
              kn_edge_name: iev
              kn_gameserver_region: KV  # Kyiv (new code, as MI)
              kn_public_ip: 185.101.138.155  # was wisp-iev's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3    # 4 vCPU VM (the user's choice, 2026-11-12): vcpus - 1
            # 2026-11-13, the user's choice: every wisp site gets a kn machine of the same size. Ashburn
            # was VM 123 on meal (5.188.124.94) until 2026-11-16; now CT 203 "kn" on divide (group divide).
            kn-mnz:
              kn_edge_name: ashburn     # Ashburn/Manassas: ashburn-<n>.krunk.io, "Ashburn #<n>" as before
              kn_gameserver_region: VA  # Ashburn, Virginia
              kn_public_ip: 91.199.82.174  # divide's public address: the ashburn-<n>.krunk.io A records
              kn_listen_ip: 172.16.5.94    # CT 203's own address: the game sockets bind here (DNAT)
              # What divide DNATs to CT 203 (tcp + udp; /etc/pve/firewall/203.fw opens the same): the
              # Box Office instances 21015-21017 and Krunker Strike 21115. edges.yml refuses a
              # kn_gameserver_count or Strike count outside it; kru's kn_rtc NAT hairpins these ports.
              kn_forwarded_ports: ["21015-21017", "21115"]
              kn_gameserver_count: 3    # 4 cores (CT 203): vcpus - 1, the three forwarded ports
            kn-jnb:
              kn_edge_name: jnb
              kn_gameserver_region: JN  # Johannesburg (af-ct, alias me-bhn; services/brain/registry.c)
              kn_public_ip: 5.188.120.31  # was wisp-jnb's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3
            kn-ams:
              kn_edge_name: ams
              kn_gameserver_region: AM  # Amsterdam (de-fra, with Kyiv)
              kn_public_ip: 92.38.186.100  # was wisp-ams's last non-apex wisp.baby address (abulxt)
              kn_gameserver_count: 3
    # See the header. Membership only: kru and kn-mnz keep their vars in central / edges_kn above.
    divide:
      hosts:
        kru:
        kn-mnz:
