# KrunkNative's side of the edge host firewall: a thin wrapper that maps kn_*
# inputs onto the vendored edge_firewall role (edge-firewall-contract v1,
# README.md "Edge firewall"). Run alone: `ansible-playbook firewall.yml`.
- name: Edge firewall (vendored edge_firewall role)
  ansible.builtin.import_role:
    name: edge_firewall
  vars:
    edge_firewall_own_base: "{{ kn_firewall_own_base }}"
    edge_firewall_owner: "krunknative (inputs: deploy/ansible roles/kn_firewall)"
    edge_firewall_ssh_port: "{{ kn_firewall_ssh_port }}"
    edge_firewall_rollback_seconds: "{{ kn_firewall_rollback_seconds }}"
    edge_firewall_dropins:
      - name: krunknative
        priority: 60
        source: deploy/ansible roles/kn_firewall
        comment:
          - "Managed by Ansible. server_bin game ports: TCP game + UDP knet transport +"
          - "UDP server-info query, one port per instance (kn_gameserver_first_port..+count-1)."
        tcp: ["{{ kn_firewall_game_ports }}"]
        udp: ["{{ kn_firewall_game_ports }}"]
