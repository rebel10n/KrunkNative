# Keep the newest kn_keep_releases directories of prune_dir (by mtime), never the
# one `current` points at. Shared by kn_release and kn_web.
- name: List releases in {{ prune_dir }}
  ansible.builtin.find:
    paths: "{{ prune_dir }}"
    file_type: directory
    recurse: false
  register: prune_found

- name: Remove releases beyond the newest {{ kn_keep_releases }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (prune_found.files | sort(attribute='mtime', reverse=true))[kn_keep_releases | int:] }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename != kn_release_id
