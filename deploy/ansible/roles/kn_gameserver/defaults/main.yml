# server_bin instances on the edges (dedicated-server contract):
#   count = vcpus - 1 (one core left for the host's other services), at least 1;
#   instance n (1-based): port {{ kn_gameserver_first_port }}+n-1, TCP game + UDP
#   server-info query on the same number; hostname <edge>-<n>.krunk.io.
# kn_gameserver_first_port / kn_gameserver_count live in group_vars/edges/main.yml
# (shared with edge_firewall, which opens exactly those ports).
kn_gameserver_hostname_fmt: "{{ kn_edge_name }}-%d.{{ kn_domain }}"
# Units are installed but stay disabled/stopped until the finder heartbeat code
# (server.cfg finder_url) lands in the shipped server_bin: flip to true then.
kn_gameserver_enabled: false
# Escape hatch: false keeps a host's units down regardless of kn_gameserver_enabled
# (e.g. if its game ports cannot be opened). edge_firewall opens them on every edge.
kn_gameserver_ports_open: true
kn_gameserver_name_prefix: "Krunker Box Office {{ kn_edge_name | capitalize }}"
# Region id = the 2-letter code the client shows (SV LA CH VA: client/src/ui/servers_ui.c
# k_regions; accounts.region_index); per host in the inventory.
kn_gameserver_region: local
kn_gameserver_max_players: 8
# server.cfg modes: "rotation" (Krunker's public modes: ffa, point, ctf, kc, dom) or a list of
# mode aliases / names / ids, e.g. [ffa, tdm, "rotation"]; "" = Free for All only. Every round end
# offers vote cards over the maps that support each mode; no votes = a random card. Modes the lobby
# cannot play (minPlayers above max_players) are left out of a multi-mode rotation.
kn_gameserver_modes: rotation
# Per-instance override (instance number -> modes), e.g. {3: [tdm], 4: "ffa,kc"}.
kn_gameserver_instance_modes: {}
# NextBot fill (server.cfg bot_quota, doc/console.md "Bots"): once a human is in the game the
# lobby is filled up to this many players with bots; one leaves per human that joins and one
# comes back per human that leaves. An empty lobby has none (they leave
# kn_gameserver_bot_quota_grace seconds after the last human). Bots never count as players in
# the lobby list / matchmaker, earn nothing and never join ranked or hosted custom games.
# Off switch: kn_gameserver_bots_enabled: false (or a quota of 0).
kn_gameserver_bots_enabled: true
kn_gameserver_bot_quota: "{{ kn_gameserver_max_players }}"
kn_gameserver_bot_difficulty: normal
kn_gameserver_bot_quota_grace: 10
# Per-instance override (instance number -> quota, 0 = no bots), e.g. {2: 0, 3: 6}.
kn_gameserver_instance_bot_quota: {}
# server.cfg shutdown_reason_file: the "Restart game servers" handlers write "update" here
# for the restart (players see GAME UPDATING and rejoin), then remove it. A tmpfs path
# outside the unit's sandbox writes (ProtectSystem=strict still lets server_bin read it).
kn_gameserver_stop_reason_file: /run/krunknative-deploy/gameserver-stop-reason
# A deploy restart drains: every instance refuses new players and finishes its round (server.cfg
# shutdown_grace), then restarts; an empty instance restarts at once. All instances of a host drain
# in parallel, so a deploy waits at most this long per host (chitown, then the rest). Players still
# in a round when it runs out get "GAME UPDATING" and rejoin with a fresh ticket. One v7 public
# round is 4 minutes.
kn_gameserver_drain_timeout: 240
# Billboard text on every map billboard (server.cfg billboard); empty = the maps keep their own posters.
kn_gameserver_billboard: ""
# online_mode 1 on every instance: signed-in players are verified (coordinator ticket /
# session, or auth_url hasJoined for finder and direct joins) and their progress is saved;
# guests join every instance too and play unsaved, as in Krunker (no account-only lobbies;
# ranked needs an account through the ranked queue). Escape hatch: false = no hasJoined
# (coordinator tickets and sessions still identify accounts). Needs a server_bin with
# guest-welcome online_mode: an older one refuses guests on online_mode instances.
kn_gameserver_online_mode: true
kn_gameserver_finder_url: "{{ kn_matchmaker_url }}"
kn_gameserver_auth_url: "{{ kn_coordinator_url }}"
# Address the game sockets bind to (= the A record of <edge>-<n>).
kn_gameserver_listen_host: "{{ kn_public_ip }}"
# Internal game-server <-> coordinator link (kn_brain internal_ws, matchmaking /mm/seek-game).
# wss:// through the edges (coordinator.krunk.io: DNS-only CNAME to abulxt's edges) to
# kn-brain-coord on the central node; server_bin verifies the certificate against the system CA
# store. The node advertises public_host/port + region in its hello (the TCP peer is the edge).
# "" = standalone (finder-listed only).
kn_gameserver_coordinator_url: "wss://coordinator.{{ kn_domain }}/mm/internal/ws"
# The secret is brain.internal_secret of that coordinator: read from the central node's
# {{ kn_etc_dir }}/secrets.env (role kn_brain) at deploy time, written only into the 0640
# server-<n>.cfg. Never in git.
kn_gameserver_secret_host: "{{ groups['central'] | first }}"
