# A deploy restart tells the players why: server_bin reads "update" from its
# shutdown_reason_file (server.cfg) on SIGTERM and sends them v7.1.4's "GAME UPDATING"
# (their clients then rejoin through the coordinator with a fresh join ticket). All of them
# listen to "Restart game servers" and run in this order (a reason file left behind by a failed
# run is ignored by server_bin after 15 minutes).
- name: Stop reason directory
  ansible.builtin.file:
    path: "{{ kn_gameserver_stop_reason_file | dirname }}"
    state: directory
    mode: "0755"
  listen: Restart game servers
  when: kn_gameserver_active

- name: Stop reason for the restart (update)
  ansible.builtin.copy:
    dest: "{{ kn_gameserver_stop_reason_file }}"
    content: "update\n"
    mode: "0644"
  listen: Restart game servers
  when: kn_gameserver_active

- name: Reload systemd units (game servers)
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: kn_gameserver_active
  ignore_errors: "{{ ansible_check_mode }}"
  listen: Restart game servers

# One systemctl call for every instance: their stops (drains, up to kn_gameserver_drain_timeout
# each) run in parallel and each instance starts again as soon as its own drain ended. One
# restart after another would add the drains up (11 instances on angeles). The timeout bounds the
# deploy; systemd finishes whatever is left of the jobs on its own. (--check: not run.)
- name: Restart game server instances (drain, in parallel)
  ansible.builtin.command:
    argv: "{{ ['timeout', ((kn_gameserver_drain_timeout | int) + 60) | string, 'systemctl', 'restart']
              + (range(1, (kn_gameserver_count | int) + 1) | map('regex_replace', '^(.*)$', 'kn-gameserver@\\1') | list) }}"
  changed_when: true
  when: kn_gameserver_active
  listen: Restart game servers

- name: Clear the stop reason
  ansible.builtin.file:
    path: "{{ kn_gameserver_stop_reason_file }}"
    state: absent
  listen: Restart game servers
