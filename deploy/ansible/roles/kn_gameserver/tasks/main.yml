# server_bin links libcrypto (knsvc), libcrypt and libcurl (https finder/auth);
# package names differ per release (t64 from trixie on).
- name: Runtime libraries for server_bin
  ansible.builtin.apt:
    name:
      - libcrypt1
      - "{{ {'bullseye': 'libssl1.1', 'bookworm': 'libssl3'}.get(ansible_facts.distribution_release, 'libssl3t64') }}"
      - "{{ 'libcurl4' if ansible_facts.distribution_release in ['bullseye', 'bookworm'] else 'libcurl4t64' }}"
    state: present
    install_recommends: false

# The game ports are opened by edge_firewall (60-krunknative.nft in the shared
# edge-firewall-contract v1 nftables, same kn_gameserver_first_port/count).
- name: Instance plan
  ansible.builtin.set_fact:
    kn_gameserver_active: "{{ (kn_gameserver_enabled | bool) and (kn_gameserver_ports_open | bool) }}"

- name: Planned instances
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ kn_gameserver_count }} instance(s)
      (vcpus {{ ansible_processor_vcpus | default('?') }}), ports
      {{ kn_gameserver_first_port }}..{{ kn_gameserver_first_port + (kn_gameserver_count | int) - 1 }} tcp+udp,
      active={{ kn_gameserver_active }}

# coordinator_secret / join_secret = KN_BRAIN_INTERNAL_SECRET / KN_BRAIN_JOIN_SECRET of the
# coordinator (role kn_brain generated them once on the central node).
- name: Coordinator secrets from the central node
  ansible.builtin.slurp:
    src: "{{ kn_etc_dir }}/secrets.env"
  delegate_to: "{{ kn_gameserver_secret_host }}"
  run_once: true
  register: kn_gs_secrets_env
  when: kn_gameserver_coordinator_url | length > 0
  no_log: true

- name: Coordinator secrets
  ansible.builtin.set_fact:
    kn_gs_internal_secret: "{{ kn_gs_env | select('match', '^KN_BRAIN_INTERNAL_SECRET=') | map('regex_replace', '^[^=]*=', '') | first | default('') }}"
    kn_gs_join_secret: "{{ kn_gs_env | select('match', '^KN_BRAIN_JOIN_SECRET=') | map('regex_replace', '^[^=]*=', '') | first | default('') }}"
  vars:
    kn_gs_env: "{{ (kn_gs_secrets_env.content | b64decode).splitlines() if kn_gs_secrets_env.content is defined else [] }}"
  no_log: true

- name: Coordinator link needs the secret
  ansible.builtin.assert:
    that: kn_gameserver_coordinator_url | length == 0 or kn_gs_internal_secret | length >= 16
    fail_msg: "no KN_BRAIN_INTERNAL_SECRET in {{ kn_gameserver_secret_host }}:{{ kn_etc_dir }}/secrets.env"
    quiet: true

- name: Per-instance server.cfg
  ansible.builtin.template:
    src: server.cfg.j2
    dest: "{{ kn_etc_dir }}/server-{{ n }}.cfg"
    owner: root
    group: "{{ kn_group }}"
    mode: "0640"
  loop: "{{ range(1, (kn_gameserver_count | int) + 1) | list }}"
  loop_control:
    loop_var: n
    label: "server-{{ n }}.cfg :{{ kn_gameserver_first_port + n - 1 }} {{ kn_gameserver_hostname_fmt | format(n) }}"
  notify: Restart game servers
  diff: false # carries the coordinator secret

- name: Release changed -> restart
  ansible.builtin.debug:
    msg: "current -> {{ kn_svc_release_id }}"
  changed_when: kn_release_changed | default(false) | bool
  notify: Restart game servers

- name: Template unit
  ansible.builtin.template:
    src: kn-gameserver@.service.j2
    dest: /etc/systemd/system/kn-gameserver@.service
    mode: "0644"
  notify: Restart game servers

- name: Systemd target
  ansible.builtin.copy:
    dest: /etc/systemd/system/krunknative.target
    content: |
      # Managed by KrunkNative deploy/ansible
      [Unit]
      Description=KrunkNative services
      Wants=network-online.target

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

- name: Instances enabled/started (or disabled/stopped while inactive)
  ansible.builtin.systemd_service:
    name: "kn-gameserver@{{ n }}"
    enabled: "{{ kn_gameserver_active }}"
    state: "{{ 'started' if kn_gameserver_active else 'stopped' }}"
    daemon_reload: true
  loop: "{{ range(1, (kn_gameserver_count | int) + 1) | list }}"
  loop_control:
    loop_var: n
  ignore_errors: "{{ ansible_check_mode }}"

# Instances beyond the current count (vcpus shrank or first_port changed).
- name: Find stale instance configs
  ansible.builtin.find:
    paths: "{{ kn_etc_dir }}"
    patterns: "server-*.cfg"
  register: kn_gs_cfgs

- name: Stop and remove stale instances
  ansible.builtin.include_tasks: stale.yml
  loop: "{{ kn_gs_cfgs.files | map(attribute='path') | map('regex_replace', '^.*/server-(\\d+)\\.cfg$', '\\1') | map('int') | select('gt', kn_gameserver_count | int) | list }}"
  loop_control:
    loop_var: stale_n

# Krunker Strike instances (kn-strike@, strike-<n>.cfg): after the Box Office ones, never instead.
- name: Krunker Strike instances
  ansible.builtin.include_tasks: strike.yml
