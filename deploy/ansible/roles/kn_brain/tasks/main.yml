# kn_brain links every store adapter that was found at build time (postgres,
# sqlite, mariadb): the runtime libraries must exist even if only one is used.
- name: Runtime libraries for kn_brain
  ansible.builtin.apt:
    name: "{{ kn_brain_runtime_packages + [kn_brain_hiredis_package] }}"
    state: present
    install_recommends: false

- name: Release config directory
  ansible.builtin.file:
    path: "{{ kn_svc_base }}/releases/{{ kn_svc_release_id }}/config"
    state: directory
    mode: "0755"

- name: Release config (no secrets)
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ kn_svc_base }}/releases/{{ kn_svc_release_id }}/config/config.json"
    mode: "0644"
  notify: Restart kn_brain

# Until coord-store's SQLite adapter is in the shipped binary, a "sqlite" instance
# would fail its migrations (it falls back to PostgreSQL on 127.0.0.1:5432, which
# is not running here) and restart-loop. Detect it and fall back to --no-db.
# Probe the local artifact being shipped (also right under --check, where the
# release on the host is not written).
- name: Does this kn_brain build have the SQLite store
  ansible.builtin.shell: grep -c -a 'sqlite3_open' {{ (kn_artifact_root ~ '/' ~ kn_build_codename ~ '/bin/kn_brain') | quote }} || true
  register: kn_brain_sqlite_probe
  changed_when: false
  check_mode: false
  failed_when: false
  delegate_to: localhost
  become: false

- name: Effective database per instance
  ansible.builtin.set_fact:
    kn_brain_effective: >-
      {%- set out = [] -%}
      {%- for i in kn_brain_instances -%}
        {%- set db = i.db -%}
        {%- if db == 'sqlite' and (kn_brain_sqlite_probe.stdout | default('0') | int) == 0 -%}{%- set db = 'none' -%}{%- endif -%}
        {%- set _ = out.append(i | combine({'db': db})) -%}
      {%- endfor -%}
      {{ out }}

- name: Warn about the --no-db fallback
  ansible.builtin.debug:
    msg: "kn_brain has no SQLite adapter yet: {{ item.name }} runs --no-db (accounts unavailable) until coord-store lands."
  loop: "{{ kn_brain_effective }}"
  when: item.db == 'none' and (kn_brain_instances | selectattr('name', 'equalto', item.name) | first).db != 'none'

# Keys are added when missing, never rewritten (roles kn_postgres / kn_redis add theirs to the
# same file, possibly first on a fresh host).
- name: Secrets env file exists (never overwritten)
  ansible.builtin.shell: |
    set -eu
    f={{ kn_etc_dir }}/secrets.env
    grep -qs '^KN_BRAIN_INTERNAL_SECRET=' "$f" && exit 0
    umask 077
    [ -e "$f" ] || { : > "$f"; chown root:root "$f"; chmod 0600 "$f"; }
    s={{ (kn_brain_internal_secret | quote) if kn_brain_internal_secret else '$(head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n")' }}
    printf 'KN_BRAIN_INTERNAL_SECRET=%s\nKN_BRAIN_JOIN_SECRET=%s\n' "$s" "$s" >> "$f"
    echo created
  args:
    executable: /bin/bash
  register: kn_secrets
  changed_when: "'created' in kn_secrets.stdout"
  no_log: true

# Only root reads it (systemd's EnvironmentFile, the deploy's slurp, kn-db-cutover): 0600 root:root
# (it was root:kn 0640 before the database and Redis passwords joined it).
- name: Secrets env file mode
  ansible.builtin.file:
    path: "{{ kn_etc_dir }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  ignore_errors: "{{ ansible_check_mode }}"

# EnvironmentFile syntax: JSON-quoted values (= double quotes with \\ and \" escapes, which systemd reads).
- name: SMTP env file (outbound mail, never logged)
  ansible.builtin.copy:
    dest: "{{ kn_etc_dir }}/smtp.env"
    content: |
      # Managed by KrunkNative deploy/ansible (role kn_brain): kn_brain's outbound mail. Never commit.
      {% for k, v in {'KN_SMTP_HOST': kn_brain_smtp_host, 'KN_SMTP_PORT': kn_brain_smtp_port, 'KN_SMTP_TLS': kn_brain_smtp_tls,
                      'KN_SMTP_USER': kn_brain_smtp_user, 'KN_SMTP_PASSWORD': kn_brain_smtp_password,
                      'KN_SMTP_FROM': kn_brain_smtp_from} | dictsort -%}
      {{ k }}={{ v | string | to_json(ensure_ascii=False) }}
      {% endfor %}
    owner: root
    group: "{{ kn_group }}"
    mode: "0640"
  when: (kn_brain_smtp_host | length > 0) and (kn_brain_smtp_password | length > 0)
  no_log: true
  notify: Restart kn_brain

- name: Note when no SMTP settings were given
  ansible.builtin.debug:
    msg: "KN_SMTP_HOST / KN_SMTP_PASSWORD not set: {{ kn_etc_dir }}/smtp.env left as it is (kn_brain sends no mail without it). Source ~/.config/kn-secrets/smtp.env or set the KN_SMTP_* CI secrets."
  when: (kn_brain_smtp_host | length == 0) or (kn_brain_smtp_password | length == 0)

- name: Systemd target
  ansible.builtin.copy:
    dest: /etc/systemd/system/krunknative.target
    content: |
      # Managed by KrunkNative deploy/ansible
      [Unit]
      Description=KrunkNative services
      Wants=network-online.target

      [Install]
      WantedBy=multi-user.target
    mode: "0644"

# The database of each instance that has one: KN_DATABASE_* in <name>-db.env. Created as SQLite
# (what the unit passed on its command line before) and never rewritten here: kn-db-cutover
# switches it (role kn_db_cutover), so a later deploy cannot silently move an instance back.
- name: Database env of each instance (created once)
  ansible.builtin.copy:
    dest: "{{ kn_etc_dir }}/{{ item.name }}-db.env"
    content: |
      # Managed by deploy/ansible (role kn_brain) / kn-db-cutover: kn-brain-{{ item.name }}'s database.
      KN_DATABASE_DRIVER=sqlite
      KN_DATABASE_PATH={{ kn_state_dir }}/{{ item.name }}.db
    owner: root
    group: "{{ kn_group }}"
    mode: "0640"
    force: false
  loop: "{{ kn_brain_effective | selectattr('db', 'in', ['sqlite', 'postgres']) | list }}"
  loop_control:
    label: "{{ item.name }}-db.env"
  notify: Restart kn_brain

- name: Install kn_brain units
  ansible.builtin.template:
    src: kn-brain.service.j2
    dest: "/etc/systemd/system/kn-brain-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ kn_brain_effective }}"
  loop_control:
    label: "kn-brain-{{ item.name }} :{{ item.port }} {{ item.roles }} db={{ item.db }}"
  notify: Restart kn_brain

- name: Release changed -> restart
  ansible.builtin.debug:
    msg: "current -> {{ kn_svc_release_id }}"
  changed_when: kn_release_changed | default(false) | bool
  notify: Restart kn_brain

- name: Enable target and units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ ['krunknative.target'] + (kn_brain_instances | map(attribute='name') | map('regex_replace', '^', 'kn-brain-') | list) }}"
  # --check on a fresh host: the unit files above were not really written.
  ignore_errors: "{{ ansible_check_mode }}"
