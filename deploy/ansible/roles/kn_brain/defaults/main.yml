# kn_brain instances on the central node (contract: /tmp coord-auth "Production").
# Each instance = one systemd unit kn-brain-<name>.service on loopback; the
# Cloudflare tunnel maps the public hostnames to these ports.
kn_brain_config: "{{ kn_svc_current }}/config/config.json"
# Coordinator database: "sqlite" once coord-store's adapter lands (database.driver),
# "none" runs --no-db (accounts unavailable), "postgres" uses kn_brain_pg_*.
kn_coordinator_db: sqlite
kn_brain_instances:
  - name: finder
    host: matchmaker.krunk.io
    port: 8082
    roles: finder
    db: none
  - name: coord
    host: coordinator.krunk.io
    port: 8083
    roles: auth,community
    db: "{{ kn_coordinator_db }}"
kn_brain_log_level: info
# Staff accounts (config accounts.developers / accounts.moderators): kn_brain sets
# players.player_developer + player_moderator (developers) or player_moderator
# (moderators) for these usernames at every start. Developer is the highest level.
kn_brain_developers: []
kn_brain_moderators: []
# config.currentSeason (accounts.current_season): the season of the Battle Pass, the season
# stats / leaderboards and the prize wheels. Raising it rolls the season over at the next
# kn_brain start (a new `seasons` row; the older open one gets ends_at). Krunker v7.1.4: 7.
kn_brain_current_season: 7
# Secrets: put them in an ansible-vault file (group_vars/central/vault.yml, see
# README) or pass -e; generated once on the host when unset, then kept.
kn_brain_internal_secret: ""
kn_brain_runtime_packages: [libssl3, libcrypt1, libpq5, libsqlite3-0, libmariadb3]
