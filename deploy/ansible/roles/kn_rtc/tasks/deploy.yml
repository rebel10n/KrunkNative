# net-bridge/rtc (kn-rtc) on the central node (defaults/main.yml). Layout:
#   {{ kn_rtc_base }}/kn-rtc        static Go binary (built on the controller)
#   {{ kn_etc_dir }}/rtc.env        listen addresses, allowlist, limits
#   kn-rtc.service                  user {{ kn_user }}, http 127.0.0.1:{{ kn_rtc_http_port }}, udp {{ kn_rtc_public_ip }}:{{ kn_rtc_ice_port }}
#
# Host firewall: kru's nftables ruleset is Debian's default (input policy accept, not managed
# here), so udp {{ kn_rtc_ice_port }} needs no rule; the gateway binds only that one port.

- name: Gateway allowlist (edge game servers by name and IP)
  ansible.builtin.set_fact:
    kn_rtc_targets: >-
      {%- set out = [] -%}
      {%- set ports = kn_rtc_target_port_lo ~ '-' ~ kn_rtc_target_port_hi -%}
      {%- for h in kn_rtc_edge_hosts -%}
        {%- for n in range(1, (kn_rtc_target_port_hi | int) - (kn_rtc_target_port_lo | int) + 2) -%}
          {%- set _ = out.append(hostvars[h].kn_edge_name ~ '-' ~ n ~ '.' ~ kn_domain ~ ':' ~ ports) -%}
        {%- endfor -%}
        {%- set _ = out.append(hostvars[h].kn_public_ip ~ ':' ~ ports) -%}
      {%- endfor -%}
      {{ out }}

- name: The allowlist is not empty
  ansible.builtin.assert:
    that: kn_rtc_targets | length > 0
    fail_msg: "No edges in the inventory: the gateway would have nothing to connect to."
    quiet: true

- name: The ICE address is on this host
  ansible.builtin.assert:
    that: kn_rtc_public_ip in ansible_all_ipv4_addresses
    fail_msg: "{{ kn_rtc_public_ip }} is not an address of {{ inventory_hostname }} ({{ ansible_all_ipv4_addresses }}): set kn_rtc_public_ip."
    quiet: true
  when: ansible_all_ipv4_addresses is defined

# Static and reproducible (-trimpath, empty build id, -buildvcs=false): an unchanged source gives
# a byte-identical binary (no copy, no restart). Without -buildvcs=false a build inside a git
# checkout (CI) stamps vcs.revision/vcs.time/vcs.modified, so every push changed the binary and
# restarted the gateway, dropping every web player (2026-10-12: 17 restarts in 24 h).
- name: Build kn-rtc on the controller (go build)
  ansible.builtin.shell: |
    set -eu
    mkdir -p {{ (kn_rtc_binary | dirname) | quote }}
    cd {{ (kn_repo_root ~ '/net-bridge/rtc') | quote }}
    CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o {{ kn_rtc_binary | quote }} .
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false

- name: Gateway directory
  ansible.builtin.file:
    path: "{{ kn_rtc_base }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Gateway binary
  ansible.builtin.copy:
    src: "{{ kn_rtc_binary }}"
    dest: "{{ kn_rtc_base }}/kn-rtc"
    owner: root
    group: root
    mode: "0755"
  notify: Restart kn_rtc

- name: Gateway settings
  ansible.builtin.template:
    src: rtc.env.j2
    dest: "{{ kn_etc_dir }}/rtc.env"
    owner: root
    group: "{{ kn_group }}"
    mode: "0640"
  notify: Restart kn_rtc

- name: Gateway unit
  ansible.builtin.template:
    src: kn-rtc.service.j2
    dest: /etc/systemd/system/kn-rtc.service
    mode: "0644"
  notify: Restart kn_rtc

- name: Enable kn-rtc
  ansible.builtin.systemd_service:
    name: kn-rtc
    enabled: true
    state: started
    daemon_reload: true
  # --check on a fresh host: the unit file above was not really written.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart now if anything changed (before the health check)
  ansible.builtin.meta: flush_handlers

- name: Gateway answers on loopback
  ansible.builtin.uri:
    url: "http://{{ kn_rtc_http_host }}:{{ kn_rtc_http_port }}/healthz"
    status_code: [200]
  register: kn_rtc_health
  retries: 5
  delay: 2
  until: kn_rtc_health.status == 200
  when: not ansible_check_mode
