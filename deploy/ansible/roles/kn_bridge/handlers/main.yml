# A restart tells the players why: net-bridge reads "update" from KRUNK_NATIVE_STOP_REASON_FILE on
# SIGTERM and sends every browser v7.1.4's "GAME UPDATING" (their clients rejoin with a fresh
# ticket) before it closes the WebSocket (1012). All of them listen to "Restart kn_bridge" and run in this order.
- name: Stop reason directory (kn_bridge)
  ansible.builtin.file:
    path: "{{ kn_gateway_stop_reason_file | dirname }}"
    state: directory
    mode: "0755"
  listen: Restart kn_bridge

- name: Stop reason for the restart, update (kn_bridge)
  ansible.builtin.copy:
    dest: "{{ kn_gateway_stop_reason_file }}"
    content: "update\n"
    mode: "0644"
  listen: Restart kn_bridge

- name: Restart kn_bridge
  ansible.builtin.systemd_service:
    name: kn-bridge
    state: restarted
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
  listen: Restart kn_bridge

- name: Clear the stop reason (kn_bridge)
  ansible.builtin.file:
    path: "{{ kn_gateway_stop_reason_file }}"
    state: absent
  listen: Restart kn_bridge
