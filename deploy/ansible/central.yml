- name: KrunkNative central node (web + finder + coordinator + net-bridge + WebRTC gateway + edge origin + download host)
  hosts: central
  become: false
  roles:
    # fail2ban-contract v1 (README "fail2ban"): kru's base is ours; off until fail2ban_manage.
    - { role: fail2ban, tags: [fail2ban] }
    - { role: kn_user, tags: [user] }
    - { role: kn_disk, tags: [disk] }
    - { role: openresty, tags: [openresty] }
    - { role: kn_repo, tags: [repo] }
    - { role: kn_release, tags: [release, brain] }
    # redis-tier (doc/backend.md 3.11): our own PostgreSQL + Redis (both off unless enabled in
    # group_vars), then kn_brain, then the one-time SQLite -> PostgreSQL move of the coordinator.
    - { role: kn_postgres, tags: [postgres, brain] }
    - { role: kn_redis, tags: [redis, brain] }
    # the editor AI's web search (DuckDuckGo MCP server, a stdio child of kn_brain; installed with uv)
    - { role: kn_ai_search, tags: [ai_search, brain] }
    - { role: kn_brain, tags: [brain] }
    - { role: kn_db_cutover, tags: [cutover, brain] }
    - { role: kn_web, tags: [web] }
    - { role: kn_updates, tags: [updates], when: kn_updates_enabled | bool }
    - { role: kn_bridge, tags: [bridge] }
    - { role: kn_rtc, tags: [rtc] }
    # README "Edge origin": host nginx vhost for abulxt's edges (off: removed).
    - { role: kn_edge_origin, tags: [edge_origin] }
    # README "Download host": dl.krunk.io on the host nginx, Let's Encrypt (off: removed).
    - { role: kn_dl_origin, tags: [dl_origin] }
  post_tasks:
    - name: Health checks on loopback
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: [200]
        # the edge ingress routes by Host: /healthz of assets. (the others ignore Host)
        headers: { Host: "{{ kn_edge_origin_hosts.assets }}" }
      loop: >-
        {{ ['http://127.0.0.1:8081/healthz', 'http://127.0.0.1:8081/', 'http://127.0.0.1:8082/servers',
            'http://127.0.0.1:8083/mm/status', 'http://127.0.0.1:8084/healthz']
           + (['http://127.0.0.1:8085/healthz'] if kn_rtc_enabled | default(false) | bool else [])
           + (['http://127.0.0.1:' ~ kn_edge_origin_port ~ '/healthz'] if kn_edge_origin_enabled | bool else [])
           + (['http://127.0.0.1:' ~ kn_dl_origin_port ~ '/healthz'] if kn_dl_origin_enabled | default(false) | bool else []) }}
      register: kn_health
      retries: 5
      delay: 2
      until: kn_health.status == 200
      check_mode: false
      when: not ansible_check_mode
      tags: [always]
