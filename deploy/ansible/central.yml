- name: KrunkNative central node (web + finder + coordinator)
  hosts: central
  become: false
  roles:
    - { role: kn_user, tags: [user] }
    - { role: openresty, tags: [openresty] }
    - { role: kn_repo, tags: [repo] }
    - { role: kn_release, tags: [release, brain] }
    - { role: kn_brain, tags: [brain] }
    - { role: kn_web, tags: [web] }
  post_tasks:
    - name: Health checks on loopback
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: [200]
      loop:
        - http://127.0.0.1:8081/healthz
        - http://127.0.0.1:8081/
        - http://127.0.0.1:8082/servers
        - http://127.0.0.1:8083/mm/status
      register: kn_health
      retries: 5
      delay: 2
      until: kn_health.status == 200
      check_mode: false
      when: not ansible_check_mode
      tags: [always]
