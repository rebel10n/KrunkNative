# Central node (kru): OpenResty on 127.0.0.1:8081 (krunk.io), kn_brain finder
# on :8082 (matchmaker.), auth+community on :8083 (coordinator.). The host's nginx
# (:80/:443), cloudflared, the pm2 app krunkbox (:2025, kru.eli.gift) and the login
# user `kru` are not managed here. kru is CT 120 on the Proxmox host divide since 2026-11-16
# (inventory group divide: SSH through divide, no in-guest firewall or fail2ban).
kn_release_bins: [kn_brain, kn_migrate, kn_dbcopy]

# Client updates store (role kn_updates, doc/backend.md 9.8): https://dl.krunk.io/updates/ (role
# kn_dl_origin; assets.krunk.io/updates/ too while that name is the edge origin).
# Off until the user approves it: true adds the /updates/ location to OpenResty, creates
# /opt/krunknative-updates and indexes the game content (Deploy kru runs central.yml on every push).
kn_updates_enabled: true
kn_release_migrations: true

# config.currentSeason (roles/kn_brain/defaults: kn_brain_current_season). Krunker v10.0.2 is
# season 10; raising it rolls the season over when kn_brain restarts.
kn_brain_current_season: 10

# Staff accounts: highest privilege (developer, which also sets moderator).
kn_brain_developers: [ading2210, ASA_z3db0y, Joelmatic, butterfly, Krunker, synaptic, "123", jewraper425, rogo, iamhim]

# fail2ban (contract vars: group_vars/all.yml): kru's base would be ours, but it stays off for good:
# kru is a guest of divide, firewalled by divide's pve-firewall, and its sshd is reachable only from
# divide and the admin VPN. The playbooks skip the role there anyway (kn_host_firewall false,
# group_vars/divide/main.yml), so even -e fail2ban_manage=true installs nothing on kru.
fail2ban_manage: false
fail2ban_own_base: true
# scanners fill sshd's MaxStartups 10:30:100 here too (CI connects from GitHub's
# runners); the edges' values (abulxt group_vars/edge.yml).
fail2ban_sshd_settings:
  MaxStartups: "50:30:200"
  LoginGraceTime: 30

# Edge origin (role kn_edge_origin, README "Edge origin"): abulxt's OpenResty edges serve these
# names (DNS: CNAME byod.abstracteducation.loan) and relay them to kru's host nginx :443 ->
# OpenResty 127.0.0.1:kn_edge_origin_port, in place of the former Cloudflare proxy + tunnel
# (Deploy kru runs central.yml on every push): true adds the vhost and the edge ingress. The front end (krunk.io, www.) is not here (GitHub Pages).
kn_edge_origin_enabled: true    # on since 2026-10-13 (krunk.io cutover to the abulxt edges)
kn_edge_origin_port: 8086
kn_edge_origin_sni: "kn-origin.{{ kn_domain }}"
kn_edge_origin_hosts:
  assets: "assets.{{ kn_domain }}"
  coordinator: "coordinator.{{ kn_domain }}"
  matchmaker: "matchmaker.{{ kn_domain }}"
  play: "play.{{ kn_domain }}"
# Who may connect: the relays. Since kru moved to divide (2026-11-16) the only one that reaches it is
# divide's edge CT 201 (172.16.5.10, infra's edge_relay): divide's public :443 is DNATed to that CT,
# which relays the four names to kru on the LAN, and kru's pve-firewall (divide 120.fw) lets only it
# in on 80/443. The wisp /24s (wisp-iev, -mia, -jnb, -ams, -mnz) came out on 2026-11-23: those boxes
# are gone and G-Core gives their addresses to others. Overrides the role default (the /24s of group 'edges');
# our game servers never connect here directly (they reach coordinator./matchmaker.krunk.io through
# the relays). The old VPSs' lines went with them (cancelled 2026-11-13).
kn_edge_origin_allow:
  - { net: 172.16.5.10, comment: divide edge CT 201 }
  - 127.0.0.1

# redis-tier (doc/backend.md 3.11, deploy/README.md "Database cutover"): our own PostgreSQL cluster
# (127.0.0.1:5434) and Redis (127.0.0.1:6380) on kru, and the coordinator moved from coord.db to
# PostgreSQL by the first deploy that has them (kn-db-cutover: backup, copy, verify, switch; rolls
# back to SQLite by itself on failure and then holds). Passwords are generated on kru into
# /etc/krunknative/secrets.env. Back to SQLite: `kn-db-cutover rollback --yes` on kru.
# Since 2026-11-17 both live on terp.db instead (infra docs/terp-db.md): coord-db.env points at
# terp.db:5432 (TLS, verify-full), redis.env at terp.db:6382, with their passwords in secrets.env, and
# kru's own cluster (18/krunknative, start.conf manual) and kn-redis are stopped and disabled, kept as
# the rollback. kn_postgres_enabled / kn_redis_enabled false: neither role runs, so a deploy does not
# start them again or rewrite redis.env back to 127.0.0.1:6380, and kn_db_cutover's cutover (done,
# marker .cutover-postgres-coord) is skipped too. coord-db.env is never rewritten (kn_brain creates
# it only when missing). Back to the local ones: infra's rollback steps, then true here.
kn_postgres_enabled: false
kn_redis_enabled: false
kn_coordinator_db: postgres

# Disk on kru (role kn_disk, deploy/README.md "Disk on kru"): 2.1 GB free on 2026-10-13. apt's cache
# goes after every run; the journal is capped at 2G (it was 2.5 GB back to 2025-07 and journald's
# default cap of 10 % would let it reach 3.2 GB), which drops only the oldest ~0.5 GB of 2025 logs.
kn_disk_apt_clean: true
kn_journald_max_use: "2G"

# Download host (role kn_dl_origin, README "Download host"): dl.krunk.io -> kru's public IP (A record
# at Spaceship), host nginx :443 with a Let's Encrypt certificate -> OpenResty 127.0.0.1:kn_dl_origin_port:
# the whole asset tree and /updates/, the Pages asset CDN's source and the clients' fallback
# (deploy/asset-shards.json "download"). Enable once the A record resolves (the first run gets the
# certificate); Deploy kru runs central.yml on every push.
kn_dl_origin_enabled: true
kn_dl_origin_port: 8087
kn_dl_origin_host: "dl.{{ kn_domain }}"

# WebRTC gateway (role kn_rtc, README "WebRTC gateway"): kru has no public address of its own on
# divide. kn-rtc binds divide's 91.199.82.174 (role default kn_rtc_public_ip), held on kru's lo by
# kru-public-ip.service, and /etc/nftables.d/kru-rtc.nft (table ip krurtc) DNATs the udp 21100 that
# divide forwards to kru onto it and hairpins kru's own connections to the Ashburn game servers
# (91.199.82.174, kn-mnz's kn_forwarded_ports) to kn-mnz on the LAN. Made by hand on 2026-11-16/17,
# rendered by the role since (tasks/nat.yml), same names and rules.
kn_rtc_nat_enabled: true
