# Central node (kru): OpenResty on 127.0.0.1:8081 (krunk.io), kn_brain finder
# on :8082 (matchmaker.), auth+community on :8083 (coordinator.). The host's nginx
# (:80/:443), cloudflared, the pm2 app krunkbox (:2025, kru.eli.gift) and the login
# user `kru` are not managed here.
kn_release_bins: [kn_brain, kn_migrate]

# Client updates store (role kn_updates, doc/backend.md 9.8): https://assets.krunk.io/updates/.
# Off until the user approves it: true adds the /updates/ location to OpenResty, creates
# /opt/krunknative-updates and indexes the game content (Deploy kru runs central.yml on every push).
kn_updates_enabled: true
kn_release_migrations: true

# config.currentSeason (roles/kn_brain/defaults: kn_brain_current_season). Krunker v7.1.4 is
# season 7; raising it rolls the season over when kn_brain restarts.
kn_brain_current_season: 7

# Staff accounts: highest privilege (developer, which also sets moderator).
kn_brain_developers: [ading2210, ASA_z3db0y, Joelmatic, butterfly, Krunker, synaptic]

# fail2ban (contract vars: group_vars/all.yml): kru's base is ours. Off until the user
# approves it: Deploy kru runs central.yml on every push, so true applies it there.
# Apply once by hand with -e fail2ban_manage=true (README "fail2ban"), then set true here.
fail2ban_manage: false
fail2ban_own_base: true
# scanners fill sshd's MaxStartups 10:30:100 here too (CI connects from GitHub's
# runners); the edges' values (abulxt group_vars/edge.yml).
fail2ban_sshd_settings:
  MaxStartups: "50:30:200"
  LoginGraceTime: 30
