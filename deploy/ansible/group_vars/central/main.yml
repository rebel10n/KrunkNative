# Central node (kru): OpenResty on 127.0.0.1:8081 (krunk.io), kn_brain finder
# on :8082 (matchmaker.), auth+community on :8083 (coordinator.). The host's nginx
# (:80/:443), cloudflared, the pm2 app krunkbox (:2025, kru.eli.gift) and the login
# user `kru` are not managed here.
kn_release_bins: [kn_brain, kn_migrate, kn_dbcopy]

# Client updates store (role kn_updates, doc/backend.md 9.8): https://assets.krunk.io/updates/.
# Off until the user approves it: true adds the /updates/ location to OpenResty, creates
# /opt/krunknative-updates and indexes the game content (Deploy kru runs central.yml on every push).
kn_updates_enabled: true
kn_release_migrations: true

# config.currentSeason (roles/kn_brain/defaults: kn_brain_current_season). Krunker v7.1.4 is
# season 7; raising it rolls the season over when kn_brain restarts.
kn_brain_current_season: 7

# Staff accounts: highest privilege (developer, which also sets moderator).
kn_brain_developers: [ading2210, ASA_z3db0y, Joelmatic, butterfly, Krunker, synaptic]

# fail2ban (contract vars: group_vars/all.yml): kru's base is ours. Off until the user
# approves it: Deploy kru runs central.yml on every push, so true applies it there.
# Apply once by hand with -e fail2ban_manage=true (README "fail2ban"), then set true here.
fail2ban_manage: false
fail2ban_own_base: true
# scanners fill sshd's MaxStartups 10:30:100 here too (CI connects from GitHub's
# runners); the edges' values (abulxt group_vars/edge.yml).
fail2ban_sshd_settings:
  MaxStartups: "50:30:200"
  LoginGraceTime: 30

# Edge origin (role kn_edge_origin, README "Edge origin"): abulxt's OpenResty edges serve these
# names (DNS: CNAME byod.abstracteducation.loan) and relay them to kru's host nginx :443 ->
# OpenResty 127.0.0.1:kn_edge_origin_port, in place of the Cloudflare proxy + tunnel. Off until the
# cutover (Deploy kru runs central.yml on every push): true adds the vhost and the edge ingress;
# the tunnel keeps working either way. The front end (krunk.io, www.) is not here (GitHub Pages).
kn_edge_origin_enabled: true    # on since 2026-10-13 (krunk.io cutover to the abulxt edges)
kn_edge_origin_port: 8086
kn_edge_origin_sni: "kn-origin.{{ kn_domain }}"
kn_edge_origin_hosts:
  assets: "assets.{{ kn_domain }}"
  coordinator: "coordinator.{{ kn_domain }}"
  matchmaker: "matchmaker.{{ kn_domain }}"
  play: "play.{{ kn_domain }}"
# Cloudflare tunnel management by kn_bridge / kn_rtc (play.krunk.io CNAME -> tunnel, ingress
# rules), only when CF_API_TOKEN + CF_ACCOUNT_ID are in the environment. Set false once the
# play.krunk.io record points at the edges: otherwise a run with those variables puts the
# proxied tunnel CNAME back.
kn_cloudflare_tunnel: false   # 2026-10-13: assets/matchmaker/play/coordinator.krunk.io are CNAMEs to the abulxt edges

# redis-tier (doc/backend.md 3.11, deploy/README.md "Database cutover"): our own PostgreSQL cluster
# (127.0.0.1:5434) and Redis (127.0.0.1:6380) on kru, and the coordinator moved from coord.db to
# PostgreSQL by the first deploy that has them (kn-db-cutover: backup, copy, verify, switch; rolls
# back to SQLite by itself on failure and then holds). Passwords are generated on kru into
# /etc/krunknative/secrets.env. Back to SQLite: `kn-db-cutover rollback --yes` on kru.
kn_postgres_enabled: true
kn_redis_enabled: true
kn_coordinator_db: postgres

# Disk on kru (role kn_disk, deploy/README.md "Disk on kru"): 2.1 GB free on 2026-10-13. apt's cache
# goes after every run; the journal is capped at 2G (it was 2.5 GB back to 2025-07 and journald's
# default cap of 10 % would let it reach 3.2 GB), which drops only the oldest ~0.5 GB of 2025 logs.
kn_disk_apt_clean: true
kn_journald_max_use: "2G"
