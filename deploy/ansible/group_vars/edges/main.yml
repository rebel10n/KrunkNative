# Edges: server_bin instances only. The hosts also run abulxt's relays (nginx on
# 80/443/8080, wispurr on loopback :6001, OpenResty): nothing of theirs is managed
# here. The host firewall is shared with abulxt (block at the end of this file).
kn_release_bins: [server_bin]
kn_release_migrations: false
kn_release_assets: [maps]

# Game ports, shared by kn_gameserver (instances) and edge_firewall (nftables):
#   count = vcpus - 1 (one core left for the host's other services), at least 1;
#   instance n (1-based) uses port kn_gameserver_first_port+n-1 for TCP game +
#   UDP game transport (knet) + UDP server-info query.
kn_gameserver_first_port: 21015
kn_gameserver_count: "{{ [((ansible_facts.processor_vcpus | default(ansible_facts.processor_nproc) | int) - 1), 1] | max }}"

# "first-last" (or a single port) for the firewall drop-in below.
kn_gameserver_port_range: >-
  {{ (kn_gameserver_first_port | string) if (kn_gameserver_count | int) == 1 else
     ((kn_gameserver_first_port | string) ~ '-' ~ ((kn_gameserver_first_port | int) + (kn_gameserver_count | int) - 1)) }}

# Krunker Strike instances (role kn_gameserver tasks/strike.yml), beside the Box Office ones above,
# which they never replace or renumber: 2 on hosts with 8+ vcpus (angeles), else 1; port
# kn_strike_first_port+n-1 (group_vars/all.yml), TCP game + UDP knet + server-info like the others.
# The role starts fewer (none) when the host's memory cannot hold them next to the Box Office
# servers (kn_strike_memory_* in the role defaults). false = no Strike on the edges.
kn_strike_enabled: true
kn_strike_count: >-
  {{ ([2 if (ansible_facts.processor_vcpus | default(ansible_facts.processor_nproc) | int) >= 8 else 1,
       kn_strike_port_span | int] | min) if kn_strike_enabled | bool else 0 }}
kn_strike_port_range: >-
  {{ (kn_strike_first_port | string) if (kn_strike_count | int) <= 1 else
     ((kn_strike_first_port | string) ~ '-' ~ ((kn_strike_first_port | int) + (kn_strike_count | int) - 1)) }}

# --- Host firewall: vendored edge_firewall role (edge-firewall-contract v1) ---
# README.md "Edge firewall". The same variables, in the same order, are set in
# abulxt (deploy/ansible/inventory/group_vars/edge.yml) and KrunkNative
# (deploy/ansible/group_vars/edges/main.yml).
edge_firewall_manage: true
# Base /etc/nftables.conf: exactly one repo sets true (now abulxt). Handover:
# flip both repos together, run the new owner's firewall.yml first.
edge_firewall_own_base: false
edge_firewall_owner: "krunknative (inputs: deploy/ansible group_vars/edges/main.yml)"
edge_firewall_ssh_port: 22
edge_firewall_rollback_seconds: 120
# This repo's drop-in. Ports must not overlap abulxt's.
edge_firewall_dropins:
  - name: krunknative
    priority: 60
    source: deploy/ansible group_vars/edges/main.yml
    comment:
      - "krunknative game ports: one per server_bin instance (tcp game, udp knet + server-info)."
      - "Box Office instances first, then the Krunker Strike instances (kn_strike_first_port)."
    tcp: "{{ [kn_gameserver_port_range] + ([kn_strike_port_range] if (kn_strike_count | int) > 0 else []) }}"
    udp: "{{ [kn_gameserver_port_range] + ([kn_strike_port_range] if (kn_strike_count | int) > 0 else []) }}"

# Live since 2026-10-11 (go-live): a plain `ansible-playbook edges.yml` keeps the units
# running. Set false (or -e kn_gameserver_enabled=false) to take the edges down.
kn_gameserver_enabled: true

# In-map billboard text on every edge server.
kn_gameserver_billboard: "discord.gg/RqnSxVtUyk"

# DNS (tag dns, role kn_dns_check): the <edge>-<n>.krunk.io A records are kept by hand in
# Spaceship's DNS panel (the zone left Cloudflare on 2026-10-13); the role only checks them.
