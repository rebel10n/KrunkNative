# Shared settings (every value can be overridden with -e or host_vars).
kn_repo_root: "{{ playbook_dir | dirname | dirname }}"

# Service user (system account, no login shell, no sudo). The pre-existing login
# user `kru` on the central node is never touched.
kn_user: kn
kn_group: kn
kn_state_dir: /var/lib/krunknative
kn_etc_dir: /etc/krunknative

# Release id: CI passes the commit sha; local runs use HEAD (+ "-dirty").
kn_release_id: >-
  {{ lookup('ansible.builtin.env', 'GITHUB_SHA')[:12]
     | default(lookup('ansible.builtin.pipe', 'git -C ' ~ kn_repo_root ~ ' rev-parse --short=12 HEAD')
               ~ ('-dirty' if lookup('ansible.builtin.pipe', 'git -C ' ~ kn_repo_root ~ ' status --porcelain -uno') else ''), true) }}
kn_keep_releases: 3

# Local build outputs (deploy/ansible/build.sh, or CI). Per Debian release because
# clara is bullseye (glibc 2.31, OpenSSL 1.1); trixie hosts use the bookworm build.
kn_artifact_root: "{{ kn_repo_root }}/dist/deploy"
kn_web_dist: "{{ kn_repo_root }}/dist/web"

kn_domain: krunk.io
kn_matchmaker_url: "https://matchmaker.{{ kn_domain }}"
kn_coordinator_url: "https://coordinator.{{ kn_domain }}"
# Page origins allowed to call the brains (CORS): the Pages front end (krunk.io, www.,
# the pages.dev preview) and the legacy domain, whose subdomains stay up for old clients.
kn_web_origins:
  - "https://{{ kn_domain }}"
  - "https://www.{{ kn_domain }}"
  - "https://krunknative.pages.dev"
  - "https://krunker.party"
