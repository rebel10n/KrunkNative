# KrunkNative Ansible (deploy/ansible/README.md). Run from this directory:
#   ansible-playbook site.yml --check --diff
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false
host_key_checking = true
forks = 8

[ssh_connection]
# ssh_config holds the host aliases (modelled on the edge fleet's config).
ssh_args = -F ssh_config -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
