# Krunker Box Office Pages replacement preview. This listener is LOOPBACK ONLY.
# Host nginx already includes /etc/nginx/mime.types (Debian's nginx.conf).
# Stage with deploy/pages/owned.sh publish-stage; production ingress is separate.
server {
    listen 127.0.0.1:18080;
    server_name krunk.io www.krunk.io;

    root /opt/krunknative-pages/current;
    index index.html;
    autoindex off;
    disable_symlinks off; # current -> releases/<id>

    # HTML, loader, config and service worker are revalidated after a new release.
    add_header Cache-Control "no-cache" always;

    location = /kn-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The hash covers JS, Wasm and data together. Older hashed triples are shipped
    # beside the new ones for any page cached before a cutover or roll-forward.
    location ~ "^/client\.[0-9a-f]{16}\.wasm$" {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ "^/client\.[0-9a-f]{16}\.(js|data)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Old relative asset URLs still find the existing CDN; no asset tree copied.
    location ^~ /assets/ {
        return 302 https://assets.krunk.io$request_uri;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
