# kru host nginx: /etc/nginx/sites-available/krunknative-pages-origin.conf, enabled as
# sites-enabled/zz-krunknative-pages-origin.conf (OWNED_HOST.md). The krunk.io front end for the
# divide edge relay CT 201, which proxies krunk.io / www.krunk.io here by Host. It listens on the
# wildcard :80 (never an address-specific `listen 172.16.5.47:80`, which would take that address
# away from kru's other :80 vhosts such as kru.eli.gift): divide's divide_guests from_edge chain and
# CT 120's /etc/pve/firewall/120.fw already pass edge -> kru tcp 80, so no firewall change. The
# loopback 127.0.0.1:18080 stage (owned-stage.nginx.conf) stays for verify-stage.
server {
    listen 80;
    server_name krunk.io www.krunk.io;
    allow 172.16.5.10; # divide edge relay CT 201 (test from there; kru's 127.0.0.1:80 is another vhost)
    deny all;

    root /opt/krunknative-pages/current;
    index index.html;
    autoindex off;
    disable_symlinks off;
    add_header Cache-Control "no-cache" always;

    location = /kn-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ "^/client\.[0-9a-f]{16}\.wasm$" {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ "^/client\.[0-9a-f]{16}\.(js|data)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        return 302 https://assets.krunk.io$request_uri;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
