# PENDING CUTOVER: copy to kru host nginx ONLY after review. Not installed.
# LAN origin for CT 201; the existing 127.0.0.1:18080 stage remains available.
server {
    listen 172.16.5.47:18080;
    server_name krunk.io www.krunk.io;
    allow 172.16.5.10; # divide edge relay CT 201
    deny all;

    root /opt/krunknative-pages/current;
    index index.html;
    autoindex off;
    disable_symlinks off;
    add_header Cache-Control "no-cache" always;

    location = /kn-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~ "^/client\.[0-9a-f]{16}\.wasm$" {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~ "^/client\.[0-9a-f]{16}\.(js|data)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        return 302 https://assets.krunk.io$request_uri;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
