# PENDING CUTOVER: review/install on divide edge-relay CT 201, NOT on kru.
# /usr/local/openresty/nginx/conf/conf.d/25-krunknative-pages.conf
# TLS certificate must be obtained by DNS-01 before activation; see OWNED_HOST.md.
# The existing service vhosts in 20-krunkio.conf stay untouched.
server {
    listen 80;
    listen [::]:80;
    server_name krunk.io www.krunk.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen unix:/run/openresty/front/vhosts.sock;
    server_name krunk.io www.krunk.io;

    # Static DNS-01 certificate: existing CT 201 resty.auto-ssl rejects domains
    # outside its allow-list until they point to this edge (i.e. after cutover).
    ssl_certificate /etc/letsencrypt/live/krunk.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krunk.io/privkey.pem;

    location / {
        proxy_pass http://172.16.5.47:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
