# divide edge relay CT 201 (NOT kru): /usr/local/openresty/nginx/conf/conf.d/25-krunknative-pages.conf
# (OWNED_HOST.md). The krunk.io / www.krunk.io front end -> kru's host nginx :80 by Host
# (owned-origin.nginx.conf). The service vhosts in 20-krunkio.conf stay untouched.
server {
    listen 80;
    listen [::]:80;
    server_name krunk.io www.krunk.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen unix:/run/openresty/front/vhosts.sock;
    http2 on;
    server_name krunk.io www.krunk.io;

    # Static DNS-01 certificate (certbot on this CT, renewed by certbot.timer through
    # /etc/letsencrypt/kn-spaceship-hook.py = deploy/pages/certbot-spaceship-hook.py; the deploy hook
    # reloads openresty). resty.auto-ssl's allow-list does not cover these names.
    ssl_certificate /etc/letsencrypt/live/krunk.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krunk.io/privkey.pem;

    location / {
        proxy_pass http://172.16.5.47:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
